<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo – Site d'actions militantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --ink:#1f2328; --muted:#5d636b; --line:#e2ded4;
    --accent:#b3361f; --accent-soft:#f6e3de; --ok:#2f6b3a; --ok-soft:#e2efe3; --warn:#8a5a00; --warn-soft:#f7ecd2; --info:#1f5f8b; --info-soft:#dfecf5;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181b; --card:#1f2226; --ink:#eceae5; --muted:#a3a7ad; --line:#33373c;
      --accent:#e3684f; --accent-soft:#3a2420; --ok:#7cc48a; --ok-soft:#1f3123; --warn:#e0b04f; --warn-soft:#3a3020; --info:#7db6de; --info-soft:#1d2c38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
  a{color:var(--accent)}
  .demo{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:.85rem;padding:6px 12px}
  .demo button{font-size:.82rem;padding:2px 10px;margin-left:8px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .bar{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.15rem}
  nav{display:flex;gap:2px;flex-wrap:wrap}
  nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
  nav a.on{background:var(--accent-soft);color:var(--accent)}
  .who{margin-left:auto;font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:8px}
  main{max-width:980px;margin:0 auto;padding:22px 18px 40px}
  h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600}
  h1{font-size:1.5rem;margin:0 0 6px} h2{font-size:1.15rem;margin:0 0 8px}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-block}
  button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
  button:disabled{opacity:.5;cursor:default}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:600;white-space:nowrap}
  .t-a{background:var(--info-soft);color:var(--info)} .t-b{background:var(--warn-soft);color:var(--warn)} .t-c{background:var(--ok-soft);color:var(--ok)}
  .t-type{background:var(--line);color:var(--ink)} .t-alert{background:var(--accent-soft);color:var(--accent)} .t-ok{background:var(--ok-soft);color:var(--ok)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .filters select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .action{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start}
  .action.cancelled{opacity:.6}
  .action.cancelled h3{text-decoration:line-through}
  .date{background:var(--bg);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 4px;line-height:1.15}
  .date b{display:block;font-size:1.5rem} .date span{font-size:.8rem;color:var(--muted);text-transform:uppercase}
  .action h3{margin:0 0 2px;font-size:1.08rem}
  .meta{color:var(--muted);font-size:.92rem}
  .count{font-size:.88rem;color:var(--muted);text-align:right;margin-top:6px}
  .bar-fill{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;width:120px;margin-left:auto}
  .bar-fill i{display:block;height:100%;background:var(--ok)}
  @media (max-width:640px){ .action{grid-template-columns:64px 1fr} .action .side{grid-column:1 / -1} .count,.bar-fill{margin-left:0;text-align:left} }
  form label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  form input,form select,form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  form textarea{min-height:80px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .check{display:flex;gap:8px;align-items:flex-start;font-weight:400 !important;margin-top:12px}
  .check input{width:auto;margin-top:4px}
  .hint{font-size:.85rem;color:var(--muted);margin-top:3px}
  .login{max-width:440px;margin:30px auto;text-align:center}
  .login form{text-align:left}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink);font:inherit;font-weight:600}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:16px 0}
  .sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
  .otp{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
  .err{color:var(--accent);font-size:.9rem;margin-top:8px}
  .democode{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.88rem;margin-top:12px}
  .invite-banner{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-bottom:12px;text-align:left}
  .roles{display:grid;gap:8px;margin-top:10px;text-align:left}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .people li{margin-bottom:4px}
  .share{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .share a,.share button{font-size:.9rem;padding:6px 12px}
  pre.ics{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.78rem;overflow:auto;white-space:pre-wrap}
  .alert{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:.92rem;margin:10px 0}
  .linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .linkbox code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.85rem;word-break:break-all;flex:1;min-width:220px}
  .mailbox{position:fixed;right:14px;bottom:14px;width:min(380px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;display:none;z-index:5}
  .mailbox.on{display:block}
  .mail{border-bottom:1px solid var(--line);padding:8px 0;font-size:.88rem}
  .mail b{display:block}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
  .toast.on{opacity:1}
  footer{max-width:980px;margin:0 auto;padding:0 18px 30px;font-size:.82rem;color:var(--muted)}
  footer a{color:var(--muted)}
  .watermark{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .watermark span{font:700 clamp(90px,22vw,260px)/1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;color:var(--accent);opacity:.08;transform:rotate(-28deg);white-space:nowrap;user-select:none}
  @media print{.watermark span{opacity:.15}}
</style>
</head>
<body>
<div class="demo">Démonstration&nbsp;: données fictives, rien n'est enregistré. <button id="mailbtn">E-mails envoyés (0)</button></div>
<header><div class="bar">
  <span class="brand">Actions militantes</span>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>
<main id="main"></main>
<footer><a href="#" data-go="privacy">Confidentialité et mentions légales</a> · Démonstration : collectif, lieux, établissements et personnes fictifs.</footer>
<div class="mailbox" id="mailbox"></div>
<div class="toast" id="toast"></div>
<div class="watermark" aria-hidden="true"><span>DÉMO</span></div>

<script>
(function(){
const NB=" ";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const d=iso=>new Date(iso+"T12:00:00");
const isoOf=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const addDays=n=>{const x=new Date();x.setDate(x.getDate()+n);return isoOf(x);};
const nextDay=iso=>{const x=d(iso);x.setDate(x.getDate()+1);return isoOf(x);};
const longDate=iso=>{const x=d(iso);return JOURS[x.getDay()]+" "+x.getDate()+NB+MOIS[x.getMonth()];};
const hh=t=>{if(!t)return "";const [H,M]=t.split(":");return Number(H)+NB+"h"+(M&&M!=="00"?NB+M:"");};
const horaire=a=>a.start?(hh(a.start)+(a.end?" – "+hh(a.end):"")):"Horaire à préciser";
const token=()=>Array.from({length:16},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
const SITE="https://actions.exemple.fr";

// ---------- paramètres modifiables par les admins ----------
let SECTORS=["Nord","Sud"];
let TYPES=["Tractage","Affichage","Rassemblement","Réunion","Présence au groupe de travail","Autre"];
const A=["Les Tilleuls (mat.)","Les Tilleuls (élém.)","Le Parc (mat.)","Le Parc (élém.)","Les Lilas (primaire)","Victor Hugo (élém.)"];
const B=["Le Moulin (mat.)","Le Moulin (élém.)","Les Peupliers (mat.)","Les Peupliers (élém.)","La Gare (primaire)"];
let schools=A.map(n=>({n,s:"Nord"})).concat(B.map(n=>({n,s:"Sud"})));
let invites={"Nord":{token:token(),since:addDays(-6),used:3},"Sud":{token:token(),since:addDays(-6),used:5}};
const inviteUrl=s=>SITE+"/rejoindre/"+invites[s].token;

const SEC_CLS=["t-a","t-b","t-c","t-alert"];
const secTag=s=>s?`<span class="tag ${SEC_CLS[Math.max(0,SECTORS.indexOf(s))%SEC_CLS.length]}">${esc(s)}</span>`:"";
const sectorOf=n=>(schools.find(x=>x.n===n)||{}).s||"";
const schoolSelect=(name,v,emptyLabel,onlySector)=>`<select name="${name}" id="sel-${name}"><option value="">${emptyLabel}</option>${SECTORS.filter(s=>!onlySector||s===onlySector).map(s=>`<optgroup label="Secteur ${s}">${schools.filter(x=>x.s===s).sort((a,b)=>a.n.localeCompare(b.n,"fr")).map(x=>`<option ${x.n===v?"selected":""}>${esc(x.n)}</option>`).join("")}</optgroup>`).join("")}</select>`;
const GLOGO=`<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6C12.3 13.5 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.8c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.4 0-11.7-4-13.6-9.7l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>`;

// ---------- données fictives ----------
const NOTIF_DEFAULT={inscrits:true,changes:true,rappel:true};
let users=[
  {id:1,name:"Camille",email:"camille.demo@gmail.com",phone:"06 00 00 00 01",school:"La Gare (primaire)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:2,name:"Nadia",email:"nadia.demo@gmail.com",phone:"06 00 00 00 02",school:"Le Moulin (mat.)",role:"moderator",notif:{...NOTIF_DEFAULT}},
  {id:3,name:"Julien",email:"julien.demo@gmail.com",phone:"06 00 00 00 03",school:"Les Tilleuls (élém.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:4,name:"Sofia",email:"sofia.demo@gmail.com",phone:"",school:"Le Parc (mat.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:5,name:"Thomas",email:"thomas.demo@gmail.com",phone:"",school:"Les Peupliers (élém.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:6,name:"Inès",email:"ines.demo@gmail.com",phone:"",school:"",role:"pending",notif:{...NOTIF_DEFAULT}},
  {id:7,name:"Marc",email:"marc.demo@gmail.com",phone:"",school:"Victor Hugo (élém.)",role:"pending",notif:{...NOTIF_DEFAULT}},
  {id:8,name:"Alex",email:"admin.demo@gmail.com",phone:"",school:"La Gare (primaire)",role:"admin",notif:{...NOTIF_DEFAULT}}
];
let actions=[
  {id:1,by:2,name:"Nadia",phone:"06 00 00 00 02",consent:true,type:"Tractage",title:"Tractage à l'entrée de l'école de la Gare",place:"Devant l'école de la Gare",sector:"Sud",date:addDays(2),start:"08:20",end:"08:50",needed:4,desc:"Tracts à récupérer chez Nadia la veille.",status:"open"},
  {id:2,by:3,name:"Julien",phone:"06 00 00 00 03",consent:false,type:"Affichage",title:"Tournée d'affichage avenue des Tilleuls",place:"Commerces de l'avenue des Tilleuls",sector:"Nord",date:addDays(3),start:"17:00",end:"19:00",needed:3,desc:"20 affiches A3 et du scotch fournis.",status:"open"},
  {id:3,by:2,name:"Nadia",phone:"06 00 00 00 02",consent:true,type:"Présence au groupe de travail",title:"Réunion de concertation du secteur Sud",place:"Préau de l'école du Moulin",sector:"Sud",date:addDays(5),start:"18:30",end:"",needed:null,desc:"Venir nombreux. Participer n'engage pas à endosser les résultats.",status:"open"},
  {id:4,by:4,name:"Sofia",phone:"",consent:false,type:"Rassemblement",title:"Rassemblement devant la mairie",place:"Place de la mairie",sector:"",date:addDays(9),start:"",end:"",needed:null,desc:"Horaire à confirmer.",status:"open"},
  {id:5,by:3,name:"Julien",phone:"06 00 00 00 03",consent:false,type:"Tractage",title:"Tractage au marché du samedi",place:"Marché de la place du Parc",sector:"Nord",date:addDays(4),start:"10:00",end:"12:00",needed:3,desc:"",status:"cancelled",cancelMsg:"Reporté à cause de la pluie annoncée."}
];
let avail=[{a:1,u:3},{a:1,u:5},{a:2,u:4},{a:3,u:3},{a:3,u:4},{a:3,u:5},{a:5,u:4}];
let mails=[];

// ---------- état ----------
let me=null, view="login", param=null, fSector="", fType="", otp=null, flash={}, pendingInvite=null, prefill=null;
const isMember=()=>me&&me.role!=="pending";
const isMod=()=>me&&(me.role==="moderator"||me.role==="admin");
const isAdmin=()=>me&&me.role==="admin";
const go=(v,p)=>{if(v!==view)flash={};view=v;param=p;render();try{window.scrollTo(0,0);}catch(e){}};
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400);};
const userById=id=>users.find(u=>u.id===id);
const actionUrl=a=>SITE+"/action/"+a.id;

// ---------- e-mails simulés ----------
function sendMail(u,subject,body){ if(!u) return; mails.unshift({to:u.email,name:u.name,subject,body,at:new Date()}); renderMailBtn(); }
function renderMailBtn(){ document.getElementById("mailbtn").textContent="E-mails envoyés ("+mails.length+")"; const box=document.getElementById("mailbox"); if(box.classList.contains("on")) renderMailbox(); }
function renderMailbox(){
  document.getElementById("mailbox").innerHTML=`<div class="row"><h2 style="margin:0">E-mails envoyés</h2><span class="spacer"></span><button class="link" id="mailclose">Fermer</button></div>
  <p class="small muted">Démonstration&nbsp;: sur le site réel, ces messages partent vraiment par e-mail.</p>
  ${mails.length?mails.map(m=>`<div class="mail"><b>${esc(m.subject)}</b><span class="muted">À ${esc(m.name)} &lt;${esc(m.to)}&gt;</span><div>${esc(m.body).replace(/\n/g,"<br>")}</div></div>`).join(""):`<p class="muted">Aucun e-mail pour l'instant.</p>`}`;
  document.getElementById("mailclose").onclick=()=>document.getElementById("mailbox").classList.remove("on");
}
document.getElementById("mailbtn").onclick=()=>{const b=document.getElementById("mailbox");b.classList.toggle("on");renderMailbox();};
const resume=a=>a.title+"\n"+longDate(a.date)+", "+horaire(a)+"\n"+a.place+"\n"+actionUrl(a);
function notifyChange(a,kind){
  const ids=avail.filter(x=>x.a===a.id).map(x=>x.u).filter(id=>id!==me.id);
  ids.map(userById).filter(u=>u&&u.notif.changes).forEach(u=>{
    if(kind==="cancel") sendMail(u,"Action annulée : "+a.title,"L'action à laquelle vous étiez inscrit est annulée."+(a.cancelMsg?"\nMessage du proposant : "+a.cancelMsg:"")+"\n\n"+resume(a));
    else sendMail(u,"Action modifiée : "+a.title,"L'action à laquelle vous êtes inscrit a été modifiée. Nouvelles informations :\n\n"+resume(a));
  });
  return ids.length;
}

// ---------- en-tête ----------
function header(){
  const nav=document.getElementById("nav"), who=document.getElementById("who");
  if(!isMember()) nav.innerHTML="";
  else {
    const items=[["list","Actions"],["new","Proposer une action"],["mine","Mes actions"],["account","Mon compte"]];
    if(isMod()) items.push(["admin","Modération"]);
    if(isAdmin()) items.push(["settings","Paramètres"]);
    nav.innerHTML=items.map(([k,l])=>`<a href="#" data-go="${k}" class="${view===k||(view==="detail"&&k==="list")||(view==="edit"&&k==="new")?"on":""}">${l}</a>`).join("");
  }
  who.innerHTML = me ? `${esc(me.name)} <button class="link" data-act="logout">Se déconnecter</button>` : "";
}

// ---------- connexion ----------
const V={};
V.login=()=>`<div class="login card">
  ${pendingInvite?`<div class="invite-banner">Vous avez été invité par le secteur <strong>${esc(pendingInvite)}</strong>. Votre compte sera validé dès que votre adresse e-mail sera confirmée.</div>`:""}
  <h1>Actions de la mobilisation</h1>
  <p class="muted">Proposez une action (tractage, affichage, rassemblement…) ou inscrivez-vous à celles déjà proposées.</p>
  <form id="loginf">
    <label>Votre adresse e-mail</label><input name="email" type="email" required autocomplete="email" value="${esc(flash.email||"")}" placeholder="prenom@exemple.fr">
    <p class="hint">Vous recevrez un code à 6${NB}chiffres. Pas de mot de passe à retenir.</p>
    <div class="row" style="margin-top:12px"><button class="primary" type="submit" style="width:100%">Recevoir mon code de connexion</button></div>
  </form>
  <div class="sep">ou</div>
  <button class="gbtn" data-act="google">${GLOGO}Continuer avec Google</button>
  <div class="sep">démonstration</div>
  <p class="small muted">Comptes existants&nbsp;: camille.demo@gmail.com, nadia.demo@gmail.com (modératrice), admin.demo@gmail.com (administrateur). Toute autre adresse crée un nouveau compte.</p>
  <div class="roles">
    <button data-act="invite" data-s="Sud">Arriver par le lien d'invitation du secteur Sud</button>
    <button data-act="as" data-u="1">Entrer directement comme Camille (membre)</button>
    <button data-act="as" data-u="2">Entrer directement comme Nadia (modératrice)</button>
    <button data-act="as" data-u="8">Entrer directement comme Alex (administrateur)</button>
  </div></div>`;
V.otp=()=>{const o=otp;if(!o) return V.login();
  const left=Math.max(0,Math.ceil((o.exp-Date.now())/60000));
  return `<div class="login card"><h1>Vérifiez vos e-mails</h1>
  <p>Nous avons envoyé un code à 6${NB}chiffres à <strong>${esc(o.email)}</strong>.</p>
  <p class="small muted">Le code est valable 10${NB}minutes (encore ${left}${NB}min). Pensez à regarder dans les courriers indésirables.</p>
  <form id="otpf">
    <input name="code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="••••••">
    ${o.isNew?`<label>Votre prénom ou nom</label><input name="name" required autocomplete="given-name">`:""}
    ${flash.err?`<p class="err">${esc(flash.err)}</p>`:""}

// ---------- actions ----------
function count(a){return avail.filter(x=>x.a===a.id).length;}
function amIn(a){return avail.some(x=>x.a===a.id&&x.u===me.id);}
function toggleBtn(a,long){
  if(a.status==="cancelled") return `<span class="tag t-alert">Annulée</span>`;
  return amIn(a)?`<button class="ok" data-act="toggle" data-a="${a.id}">✓ Je suis disponible${long?" – me retirer":""}</button>`:`<button class="primary" data-act="toggle" data-a="${a.id}">Je suis disponible</button>`;
}
function actionCard(a){
  const n=count(a), x=d(a.date), fill=a.needed?Math.min(100,Math.round(n/a.needed*100)):0;
  return `<div class="card action ${a.status==="cancelled"?"cancelled":""}">
    <div class="date"><span>${JOURS[x.getDay()].slice(0,3)}.</span><b>${x.getDate()}</b><span>${MOIS[x.getMonth()]}</span></div>
    <div><div class="row" style="gap:6px;margin-bottom:4px"><span class="tag t-type">${esc(a.type)}</span>${secTag(a.sector)||'<span class="tag t-type">Tous secteurs</span>'}</div>
      <h3><a href="#" data-go="detail" data-p="${a.id}" style="color:inherit">${esc(a.title)}</a></h3>
      <div class="meta">${esc(horaire(a))} · ${esc(a.place)}</div>
      <div class="meta">Proposée par ${esc(a.name)}</div>
      ${a.status==="cancelled"&&a.cancelMsg?`<div class="meta small">Annulée&nbsp;: ${esc(a.cancelMsg)}</div>`:""}</div>
    <div class="side">${toggleBtn(a)}
      ${a.status!=="cancelled"?`<div class="count">${n} disponible${n>1?"s":""}${a.needed?` sur ${a.needed} souhaités`:""}</div>${a.needed?`<div class="bar-fill"><i style="width:${fill}%"></i></div>`:""}`:""}
    </div></div>`;
}
V.list=()=>{
  const rows=actions.filter(a=>(!fSector||a.sector===fSector||!a.sector)&&(!fType||a.type===fType)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  return `<div class="row"><h1>Actions à venir</h1><span class="spacer"></span><button class="primary" data-go="new">Proposer une action</button></div>
  <div class="filters">
    <label class="small">Secteur&nbsp;: <select id="fs"><option value="">Tous</option>${SECTORS.map(s=>`<option ${s===fSector?"selected":""}>${s}</option>`).join("")}</select></label>
    <label class="small">Type&nbsp;: <select id="ft"><option value="">Tous</option>${TYPES.map(s=>`<option ${s===fType?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
  </div>${rows.length?rows.map(actionCard).join(""):`<p class="muted">Aucune action ne correspond à ces filtres.</p>`}`;
};
function shareText(a){return a.title+" – "+longDate(a.date)+", "+horaire(a)+"\nLieu : "+a.place+"\nInscrivez-vous : "+actionUrl(a);}
function icsOf(a){
  const pad=n=>String(n).padStart(2,"0"), ymd=a.date.replace(/-/g,""), t=s=>s.replace(":","")+"00";
  let dt;
  if(a.start){const end=a.end||(pad(Math.min(23,Number(a.start.slice(0,2))+1))+a.start.slice(2));
    dt="DTSTART;TZID=Europe/Paris:"+ymd+"T"+t(a.start)+"\r\nDTEND;TZID=Europe/Paris:"+ymd+"T"+t(end);}
  else dt="DTSTART;VALUE=DATE:"+ymd+"\r\nDTEND;VALUE=DATE:"+nextDay(a.date).replace(/-/g,"");
  const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Actions militantes//Demo//FR","BEGIN:VEVENT","UID:action-"+a.id+"@actions.exemple.fr",
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt,"SUMMARY:"+e(a.title),"LOCATION:"+e(a.place),
    "DESCRIPTION:"+e((a.desc?a.desc+"\n":"")+actionUrl(a)),"URL:"+actionUrl(a),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
V.detail=()=>{
  const a=actions.find(x=>x.id===param); if(!a) return `<p>Action introuvable.</p>`;
  const people=avail.filter(x=>x.a===a.id).map(x=>userById(x.u)).filter(Boolean);
  const canEdit=isMod()||a.by===me.id, open=a.status!=="cancelled";
  return `<p><a href="#" data-go="list">← Toutes les actions</a></p>
  <div class="card"><div class="row" style="gap:6px"><span class="tag t-type">${esc(a.type)}</span>${secTag(a.sector)||'<span class="tag t-type">Tous secteurs</span>'}${open?"":'<span class="tag t-alert">Annulée</span>'}</div>
    <h1 style="margin-top:6px;${open?"":"text-decoration:line-through"}">${esc(a.title)}</h1>
    <p><strong>${esc(longDate(a.date))}</strong> · ${esc(horaire(a))}<br>${esc(a.place)}</p>
    ${a.desc?`<p>${esc(a.desc)}</p>`:""}
    ${!open&&a.cancelMsg?`<div class="alert">Message du proposant&nbsp;: ${esc(a.cancelMsg)}</div>`:""}
    <h2>Contact</h2>
    <p>${esc(a.name)}${a.consent&&a.phone?` – <a href="tel:${esc(a.phone.replace(/\s/g,""))}">${esc(a.phone)}</a>`:` <span class="muted small">(numéro non affiché, contacter via le groupe WhatsApp du secteur)</span>`}</p>
    ${open?`<div class="share">
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(shareText(a))}" target="_blank" rel="noopener">Partager sur WhatsApp</a>
      <a class="btn" href="mailto:?subject=${encodeURIComponent(a.title+" – "+longDate(a.date))}&body=${encodeURIComponent(shareText(a))}">Partager par e-mail</a>
      <button data-act="ics" data-a="${a.id}">Ajouter à mon agenda (.ics)</button>
      <button data-act="copy" data-a="${a.id}">Copier le message</button></div>
    <p class="small muted">Le message partagé ne contient jamais de numéro de téléphone. Le lien demande de se connecter.</p>
    <div id="icsbox"></div>`:""}
    <div class="row" style="margin-top:12px">${toggleBtn(a,true)}
      ${canEdit?`<span class="spacer"></span>${open?`<button data-act="edit" data-a="${a.id}">Modifier</button><button data-act="cancel" data-a="${a.id}">Annuler l'action</button>`:`<button data-act="reopen" data-a="${a.id}">Rétablir</button>`}<button data-act="dup" data-a="${a.id}">Dupliquer</button>`:`<span class="spacer"></span><button data-act="dup" data-a="${a.id}">Dupliquer</button>`}</div>
    <div id="cancelbox"></div>
  </div>
  <div class="card"><h2>Disponibles (${people.length}${a.needed?` sur ${a.needed} souhaités`:""})</h2>
    ${people.length?`<ul class="people">${people.map(u=>`<li>${esc(u.name)}${(a.by===me.id||isMod())&&u.phone?` <span class="muted small">– ${esc(u.phone)}</span>`:""}</li>`).join("")}</ul>`:`<p class="muted">Personne pour l'instant.</p>`}
    <p class="small muted">Les numéros des personnes disponibles ne sont visibles que par le proposant et les modérateurs.</p></div>`;
};

      <div class="grid2" style="gap:0 10px"><div><label>Début</label><input name="start" type="time" value="${esc(a.start)}"></div><div><label>Fin</label><input name="end" type="time" value="${esc(a.end)}"></div></div>

// ---------- rendu ----------
function render(){
  if(!me){ if(!["privacy","otp","login"].includes(view)) view="login"; }
  else if(me.role==="pending" && view!=="privacy") view="pending";
  if(view==="admin" && !isMod()) view="list";
  if(view==="settings" && !isAdmin()) view="list";
  if(view!=="new") prefill=null;
  document.getElementById("main").innerHTML=(V[view]||V.list)();
  header();
  const fs=document.getElementById("fs"), ft=document.getElementById("ft");
  if(fs) fs.onchange=()=>{fSector=fs.value;render();};
  if(ft) ft.onchange=()=>{fType=ft.value;render();};
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(el)),el);};};
  const newOtp=(email,isNew)=>{otp={email,isNew,code:String(Math.floor(100000+Math.random()*900000)),exp:Date.now()+10*60000,tries:0};};
  on("loginf",v=>{const email=v.email.trim().toLowerCase();const u=users.find(x=>x.email===email);newOtp(email,!u);flash={};go("otp");});
  on("otpf",v=>{const o=otp;
    if(Date.now()>o.exp){flash={err:"Ce code a expiré. Demandez-en un nouveau."};render();return;}
    if(v.code!==o.code){o.tries++;if(o.tries>=5){flash={err:"Trop d'essais : ce code est annulé. Demandez-en un nouveau."};o.code="------";}else flash={err:"Code incorrect ("+(5-o.tries)+" essai(s) restant(s))."};render();return;}
    let u=users.find(x=>x.email===o.email);
    if(!u){u={id:Math.max(...users.map(x=>x.id))+1,name:(v.name||"").trim()||o.email.split("@")[0],email:o.email,phone:"",school:"",role:"pending",notif:{...NOTIF_DEFAULT}};users.push(u);}
    otp=null;me=u;
    if(pendingInvite&&u.role==="pending"){u.role="member";u.inviteSector=pendingInvite;invites[pendingInvite].used++;pendingInvite=null;go("welcome");return;}
    pendingInvite=null;toast("Connecté");go(u.role==="pending"?"pending":"list");});
  on("f",(v,f)=>{
    const rec={name:v.name,phone:v.phone,consent:!!v.consent,type:v.type,sector:v.sector,title:v.title,place:v.place,date:v.date,start:v.start,end:v.end,needed:v.needed?Number(v.needed):null,desc:v.desc};
    if(f.dataset.id){const a=actions.find(x=>x.id===Number(f.dataset.id));Object.assign(a,rec);const n=notifyChange(a,"edit");toast("Action modifiée"+(n?" – "+n+" inscrit(s) prévenu(s)":""));go("detail",a.id);return;}
    const rep=Number(v.repeat||0);let dates=[rec.date];
    if(rep===1) dates.push(nextDay(rec.date));
    if(rep===4){let x=rec.date;for(let i=0;i<6;i++){x=nextDay(x);const wd=d(x).getDay();if(wd===0||wd===6) continue;dates.push(x);if(wd===5)break;}}
    if(rep===7){const x=d(rec.date);x.setDate(x.getDate()+7);dates.push(isoOf(x));}
    let first=null;dates.forEach(dt=>{const id=Math.max(0,...actions.map(a=>a.id))+1;actions.push(Object.assign({id,by:me.id,status:"open"},rec,{date:dt}));if(!first)first=id;});
    prefill=null;toast(dates.length>1?dates.length+" actions publiées":"Action publiée");go("detail",first);});
  on("acc",v=>{me.name=v.name;if(v.phone!==undefined)me.phone=v.phone;me.school=v.school;
    if("n_inscrits" in v||document.querySelector('[name="n_inscrits"]')) me.notif={inscrits:!!v.n_inscrits,changes:!!v.n_changes,rappel:!!v.n_rappel};
    if(view==="pending"&&v.school){const mods=users.filter(u=>u.role==="moderator"&&sectorOf(u.school)===sectorOf(v.school));mods.forEach(m=>sendMail(m,"Nouveau compte à valider : "+me.name,me.name+" ("+me.email+") attend la validation de son compte pour l'établissement "+v.school+".\n"+SITE+"/moderation"));}
    toast("Enregistré");go(view==="welcome"?"list":view);});
  on("secf",v=>{const s=v.s.trim();if(s&&!SECTORS.includes(s)){SECTORS.push(s);invites[s]={token:token(),since:addDays(0),used:0};toast("Secteur ajouté, avec son lien d'invitation");}render();});
  on("schf",v=>{const n=v.n.trim();if(n&&!schools.some(x=>x.n===n)){schools.push({n,s:v.s});toast("Établissement ajouté");}render();});
  on("typef",v=>{const t=v.t.trim();if(t&&!TYPES.includes(t)){TYPES.push(t);toast("Type ajouté");}render();});
  const sch=document.getElementById("sel-school"), hint=document.getElementById("sec-hint");
  if(sch&&hint) sch.onchange=()=>{hint.innerHTML=sch.value?"Secteur"+NB+": "+secTag(sectorOf(sch.value)):"Le secteur sera déduit de l'établissement.";};
  document.querySelectorAll('select[data-act="role"]').forEach(s=>s.onchange=()=>{userById(Number(s.dataset.u)).role=s.value;toast("Rôle modifié");});
  document.querySelectorAll('select[data-act="schsec"]').forEach(s=>s.onchange=()=>{schools.find(x=>x.n===s.dataset.n).s=s.value;toast("Établissement déplacé en "+s.value);render();});
}
const confirmState={};
const confirmClick=(b,key,label)=>{if(confirmState[key]){delete confirmState[key];return true;}confirmState[key]=1;b.textContent=label;setTimeout(()=>{delete confirmState[key];},5000);return false;};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();if(g.dataset.go==="new")prefill=null;go(g.dataset.go,g.dataset.p?Number(g.dataset.p):null);return;}
  const b=e.target.closest("[data-act]"); if(!b||b.tagName==="SELECT") return;
  const act=b.dataset.act, aid=Number(b.dataset.a), a=actions.find(x=>x.id===aid);
  if(act==="google"){toast("Sur le site réel, Google vous demande de choisir votre compte.");return;}
  if(act==="invite"){pendingInvite=b.dataset.s;me=null;flash={};go("login");toast("Lien d'invitation du secteur "+b.dataset.s+" ouvert");return;}
  if(act==="as"){me=userById(Number(b.dataset.u));pendingInvite=null;go(me.role==="pending"?"pending":"list");return;}
  if(act==="logout"){me=null;pendingInvite=null;go("login");return;}
  if(act==="resend"){otp.code=String(Math.floor(100000+Math.random()*900000));otp.exp=Date.now()+10*60000;otp.tries=0;flash={};toast("Nouveau code envoyé");render();return;}
  if(act==="toggle"){const i=avail.findIndex(x=>x.a===aid&&x.u===me.id);
    if(i>=0){avail.splice(i,1);toast("Disponibilité retirée");}
    else{avail.push({a:aid,u:me.id});const p=userById(a.by);
      if(p&&p.id!==me.id&&p.notif.inscrits) sendMail(p,"Nouvel inscrit : "+a.title,me.name+" est disponible pour votre action.\n"+count(a)+" personne(s) inscrite(s)"+(a.needed?" sur "+a.needed+" souhaitées":"")+".\n\n"+resume(a));
      toast("Vous êtes inscrit"+(p&&p.id!==me.id?" – "+p.name+" est prévenu(e)":""));}
    render();return;}
  if(act==="edit"){go("edit",aid);return;}
  if(act==="dup"){prefill=Object.assign({},a,{date:nextDay(a.date),id:null});view="new";render();window.scrollTo&&window.scrollTo(0,0);return;}
  if(act==="cancel"){document.getElementById("cancelbox").innerHTML=`<form id="cancelf" class="card" style="margin-top:12px;background:var(--bg)"><label>Message aux inscrits (facultatif)</label><input name="msg" placeholder="Reporté à cause de la pluie…">
      <p class="hint">${count(a)}${NB}personne(s) inscrite(s) recevront un e-mail.</p><div class="row" style="margin-top:10px"><button class="primary" type="submit">Confirmer l'annulation</button></div></form>`;
    document.getElementById("cancelf").onsubmit=ev=>{ev.preventDefault();a.status="cancelled";a.cancelMsg=new FormData(ev.target).get("msg").trim();const n=notifyChange(a,"cancel");toast("Action annulée"+(n?" – "+n+" inscrit(s) prévenu(s)":""));render();};return;}
  if(act==="reopen"){a.status="open";a.cancelMsg="";toast("Action rétablie");render();return;}
  if(act==="ics"){document.getElementById("icsbox").innerHTML=`<p class="democode">Démonstration&nbsp;: sur le site réel, ce bouton télécharge le fichier «${NB}action-${a.id}.ics${NB}», qui s'ouvre dans l'agenda du téléphone ou de l'ordinateur. Contenu&nbsp;:</p><pre class="ics">${esc(icsOf(a))}</pre>`;return;}
  if(act==="copy"){try{navigator.clipboard.writeText(shareText(a)).then(()=>toast("Message copié"),()=>toast("Copie impossible ici"));}catch(err){toast("Copie impossible ici");}return;}
  if(act==="approve"){const u=userById(Number(b.dataset.u));u.role="member";sendMail(u,"Votre compte est validé","Bonjour "+u.name+", votre compte est validé. Vous pouvez voir les actions et vous inscrire :\n"+SITE);toast("Compte validé – "+u.name+" est prévenu(e)");render();return;}
  if(act==="refuse"){users=users.filter(u=>u.id!==Number(b.dataset.u));toast("Compte refusé");render();return;}
  if(act==="block"){if(!confirmClick(b,"block"+b.dataset.u,"Confirmer"))return;userById(Number(b.dataset.u)).role="pending";toast("Accès retiré : compte remis en attente");render();return;}
  if(act==="csv"){toast("Démonstration : pas de téléchargement ici.");return;}
  if(act==="copyinv"){try{navigator.clipboard.writeText(inviteUrl(b.dataset.s)).then(()=>toast("Lien copié – à partager uniquement dans le groupe WhatsApp du secteur"),()=>toast("Copie impossible ici"));}catch(err){toast("Copie impossible ici");}return;}
  if(act==="resetinv"){if(!confirmClick(b,"reset"+b.dataset.s,"Confirmer : l'ancien lien ne marchera plus"))return;invites[b.dataset.s]={token:token(),since:addDays(0),used:0};toast("Nouveau lien créé pour "+b.dataset.s+" : partagez-le dans le groupe du secteur");render();return;}
  if(act==="delsec"){SECTORS=SECTORS.filter(s=>s!==b.dataset.s);delete invites[b.dataset.s];toast("Secteur supprimé");render();return;}
  if(act==="delsch"){schools=schools.filter(x=>x.n!==b.dataset.n);toast("Établissement supprimé");render();return;}
  if(act==="deltype"){TYPES=TYPES.filter(t=>t!==b.dataset.t);toast("Type retiré (les actions existantes le gardent)");render();return;}
  if(act==="delme"){if(!confirmClick(b,"delme","Confirmer la suppression"))return;
    users=users.filter(u=>u.id!==me.id);avail=avail.filter(x=>x.u!==me.id);actions=actions.filter(x=>x.by!==me.id);me=null;toast("Compte supprimé");go("login");return;}
});
render();
})();
</script>
</body>
</html>
