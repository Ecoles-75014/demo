<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo – Site d'actions militantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --ink:#1f2328; --muted:#5d636b; --line:#e2ded4;
    --accent:#b3361f; --accent-soft:#f6e3de; --ok:#2f6b3a; --ok-soft:#e2efe3; --warn:#8a5a00; --warn-soft:#f7ecd2; --info:#1f5f8b; --info-soft:#dfecf5;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181b; --card:#1f2226; --ink:#eceae5; --muted:#a3a7ad; --line:#33373c;
      --accent:#e3684f; --accent-soft:#3a2420; --ok:#7cc48a; --ok-soft:#1f3123; --warn:#e0b04f; --warn-soft:#3a3020; --info:#7db6de; --info-soft:#1d2c38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
  a{color:var(--accent)}
  .demo{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:.85rem;padding:6px 12px}
  .demo button{font-size:.82rem;padding:2px 10px;margin-left:8px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .bar{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.15rem}
  nav{display:flex;gap:2px;flex-wrap:wrap}
  nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
  nav a.on{background:var(--accent-soft);color:var(--accent)}
  .who{margin-left:auto;font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:8px}
  main{max-width:980px;margin:0 auto;padding:22px 18px 40px}
  h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600}
  h1{font-size:1.5rem;margin:0 0 6px} h2{font-size:1.15rem;margin:0 0 8px}
  .muted{color:var(--muted)} .small{font-size:.88rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}
  button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-block}
  button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  button.link{border:none;background:none;color:var(--accent);padding:2px 4px}
  button:disabled{opacity:.5;cursor:default}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:600;white-space:nowrap}
  .t-a{background:var(--info-soft);color:var(--info)} .t-b{background:var(--warn-soft);color:var(--warn)} .t-c{background:var(--ok-soft);color:var(--ok)}
  .t-type{background:var(--line);color:var(--ink)} .t-alert{background:var(--accent-soft);color:var(--accent)} .t-ok{background:var(--ok-soft);color:var(--ok)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .filters select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .action{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start}
  .action.cancelled{opacity:.6}
  .action.cancelled h3{text-decoration:line-through}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px}
  .tabs a{padding:7px 12px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
  .t-past{background:var(--line);color:var(--muted)}
  .note-past{background:var(--info-soft);color:var(--info);border-radius:8px;padding:8px 10px;font-size:.9rem;margin:10px 0}
  .date{background:var(--bg);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 4px;line-height:1.15}
  .date b{display:block;font-size:1.5rem} .date span{font-size:.8rem;color:var(--muted);text-transform:uppercase}
  .action h3{margin:0 0 2px;font-size:1.08rem}
  .meta{color:var(--muted);font-size:.92rem}
  .count{font-size:.88rem;color:var(--muted);text-align:right;margin-top:6px}
  .bar-fill{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;width:120px;margin-left:auto}
  .bar-fill i{display:block;height:100%;background:var(--ok)}
  @media (max-width:640px){ .action{grid-template-columns:64px 1fr} .action .side{grid-column:1 / -1} .count,.bar-fill{margin-left:0;text-align:left} }
  form label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  form input,form select,form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  form textarea{min-height:80px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} @media (max-width:640px){.grid2{grid-template-columns:1fr}}
  .check{display:flex;gap:8px;align-items:flex-start;font-weight:400 !important;margin-top:12px}
  .check input{width:auto;margin-top:4px}
  .fiche{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:10px 0}
  .fiche dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding-top:2px}
  .fiche dd{margin:0}
  @media (max-width:640px){.fiche{grid-template-columns:1fr}.fiche dd{margin-bottom:6px}}
  .hint{font-size:.85rem;color:var(--muted);margin-top:3px}
  .login{max-width:440px;margin:30px auto;text-align:center}
  .login form{text-align:left}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:16px 0}
  .sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
  .otp{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
  .err{color:var(--accent);font-size:.9rem;margin-top:8px}
  .democode{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.88rem;margin-top:12px}
  .invite-banner{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-bottom:12px;text-align:left}
  .roles{display:grid;gap:8px;margin-top:10px;text-align:left}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .people li{margin-bottom:4px}
  .share{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .share a,.share button{font-size:.9rem;padding:6px 12px}
  pre.ics{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.78rem;overflow:auto;white-space:pre-wrap}
  .alert{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:.92rem;margin:10px 0}
  .linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .linkbox code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.85rem;word-break:break-all;flex:1;min-width:220px}
  .mailbox{position:fixed;right:14px;bottom:14px;width:min(380px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;display:none;z-index:5}
  .mailbox.on{display:block}
  .mail{border-bottom:1px solid var(--line);padding:8px 0;font-size:.88rem}
  .mail b{display:block}
  .dlg{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px 20px;width:min(460px,92vw)}
  .dlg::backdrop{background:rgba(0,0,0,.4)}
/* Tableaux en fiches sur téléphone : chaque ligne devient un bloc, avec le nom de la colonne au-dessus de la valeur. */
  @media (max-width:640px){
    table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%}
    table.stack tr.thead{display:none}
    table.stack tr{border-bottom:1px solid var(--line);padding:10px 0}
    table.stack td{border:none;padding:3px 0}
    table.stack td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
    table.stack td:empty{display:none}
  }
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
  .toast.on{opacity:1}
  footer{max-width:980px;margin:0 auto;padding:0 18px 30px;font-size:.82rem;color:var(--muted)}
  footer a{color:var(--muted)}
  .watermark{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .watermark span{font:700 clamp(90px,22vw,260px)/1 "Source Sans 3",system-ui,sans-serif;letter-spacing:.08em;color:var(--accent);opacity:.08;transform:rotate(-28deg);white-space:nowrap;user-select:none}
  @media print{.watermark span{opacity:.15}}
</style>
</head>
<body>
<div class="demo">Démonstration&nbsp;: données fictives, rien n'est enregistré. <button id="mailbtn">E-mails envoyés (0)</button></div>
<header><div class="bar">
  <span class="brand" id="brand">Actions militantes</span>
  <nav id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>
<main id="main"></main>
<footer><a href="#" data-go="privacy">Confidentialité et mentions légales</a> · Démonstration : collectif, lieux, établissements et personnes fictifs.</footer>
<div class="mailbox" id="mailbox"></div>
<dialog id="dispodlg" class="dlg"><form method="dialog">
  <h2 style="margin-top:0">Je suis disponible</h2>
  <label id="dispolbl" for="dispotxt" style="display:block;font-weight:600;font-size:.9rem;margin:0 0 4px"></label>
  <textarea id="dispotxt" maxlength="300" rows="3" style="width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)" placeholder="J’arriverai à 8&nbsp;h&nbsp;30, je peux apporter du scotch…"></textarea>
  <p class="hint">Facultatif. Seuls le responsable de l’action et les modérateurs le liront.</p>
  <div class="row" style="margin-top:12px"><button class="primary" value="ok">M’inscrire</button><button value="cancel" formnovalidate>Annuler</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<div class="watermark" aria-hidden="true"><span>DÉMO</span></div>

<script>
(function(){
const NB=" ";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const d=iso=>new Date(iso+"T12:00:00");
const isoOf=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const addDays=n=>{const x=new Date();x.setDate(x.getDate()+n);return isoOf(x);};
const nextDay=iso=>{const x=d(iso);x.setDate(x.getDate()+1);return isoOf(x);};
const longDate=iso=>{const x=d(iso);return JOURS[x.getDay()]+" "+x.getDate()+NB+MOIS[x.getMonth()];};
const hh=t=>{if(!t)return "";const [H,M]=t.split(":");return Number(H)+NB+"h"+(M&&M!=="00"?NB+M:"");};
const horaire=a=>a.start?(hh(a.start)+(a.end?" – "+hh(a.end):"")):"Horaire à préciser";
const token=()=>Array.from({length:16},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
const SITE="https://actions.exemple.fr";

// ---------- paramètres modifiables par les admins ----------
let SECTORS=["Nord","Sud"];
let TYPES=["Tractage","Affichage","Rassemblement","Réunion","Présence au groupe de travail","Autre"];
const A=["Les Tilleuls (mat.)","Les Tilleuls (élém.)","Le Parc (mat.)","Le Parc (élém.)","Les Lilas (primaire)","Victor Hugo (élém.)"];
const B=["Le Moulin (mat.)","Le Moulin (élém.)","Les Peupliers (mat.)","Les Peupliers (élém.)","La Gare (primaire)"];
let schools=A.map(n=>({n,s:"Nord"})).concat(B.map(n=>({n,s:"Sud"}))).map((x,i)=>Object.assign(x,{id:i+1,ref:null,consent:false,depot:"",notes:"",upd:""}));
let invites={"Nord":{token:token(),since:addDays(-6),used:3},"Sud":{token:token(),since:addDays(-6),used:5}};
const inviteUrl=s=>SITE+"/rejoindre/"+invites[s].token;

const SEC_CLS=["t-a","t-b","t-c","t-alert"];
const secTag=s=>s?`<span class="tag ${SEC_CLS[Math.max(0,SECTORS.indexOf(s))%SEC_CLS.length]}">${esc(s)}</span>`:"";
const sectorOf=n=>(schools.find(x=>x.n===n)||{}).s||"";
const schoolSelect=(name,v,emptyLabel,onlySector)=>`<select name="${name}" id="sel-${name}"><option value="">${emptyLabel}</option>${SECTORS.filter(s=>!onlySector||s===onlySector).map(s=>`<optgroup label="Secteur ${s}">${schools.filter(x=>x.s===s).sort((a,b)=>a.n.localeCompare(b.n,"fr")).map(x=>`<option ${x.n===v?"selected":""}>${esc(x.n)}</option>`).join("")}</optgroup>`).join("")}</select>`;

// ---------- données fictives ----------
const NOTIF_DEFAULT={inscrits:true,changes:true,rappel:true};
let users=[
  {id:1,name:"Camille D.",first:"Camille",last:"Durand",email:"camille.demo@gmail.com",phone:"06 00 00 00 01",school:"La Gare (primaire)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:2,name:"Nadia B.",first:"Nadia",last:"Benali",email:"nadia.demo@gmail.com",phone:"06 00 00 00 02",school:"Le Moulin (mat.)",role:"moderator",notif:{...NOTIF_DEFAULT}},
  {id:3,name:"Julien M.",first:"Julien",last:"Moreau",email:"julien.demo@gmail.com",phone:"06 00 00 00 03",school:"Les Tilleuls (élém.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:4,name:"Sofia L.",first:"Sofia",last:"Lopes",email:"sofia.demo@gmail.com",phone:"",school:"Le Parc (mat.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:5,name:"Thomas P.",first:"Thomas",last:"Petit",email:"thomas.demo@gmail.com",phone:"",school:"Les Peupliers (élém.)",role:"member",notif:{...NOTIF_DEFAULT}},
  {id:6,name:"Inès H.",first:"Inès",last:"Haddad",email:"ines.demo@gmail.com",phone:"",school:"",role:"pending",notif:{...NOTIF_DEFAULT}},
  {id:7,name:"Marc L.",first:"Marc",last:"Leroy",email:"marc.demo@gmail.com",phone:"",school:"Victor Hugo (élém.)",role:"pending",notif:{...NOTIF_DEFAULT}},
  {id:8,name:"Alex M.",first:"Alex",last:"Martin",email:"admin.demo@gmail.com",phone:"",school:"La Gare (primaire)",role:"admin",notif:{...NOTIF_DEFAULT}}
];
// Fiches de démonstration : deux référents, dont un seul a accepté d'afficher son numéro.
Object.assign(schools.find(x=>x.n==="Le Moulin (mat.)"),{ref:2,consent:true,depot:"Local du collectif, à côté du marché",notes:"Tracts disponibles le lundi soir.",upd:addDays(-2)});
Object.assign(schools.find(x=>x.n==="Les Tilleuls (élém.)"),{ref:3,consent:false,depot:"Chez le marchand de journaux (avec son accord)",upd:addDays(-4)});
const schoolById=id=>schools.find(x=>x.id===id);
const refPhone=x=>{const r=x.ref&&userById(x.ref);return r&&x.consent&&r.phone?r.phone:"";};
const telLink=t=>`<a href="tel:${esc(t.replace(/[^0-9+]/g,""))}">${esc(t)}</a>`;
let actions=[
  {id:1,by:2,name:"Nadia B.",phone:"06 00 00 00 02",consent:true,type:"Tractage",title:"Tractage à l'entrée de l'école de la Gare",place:"Devant l'école de la Gare",sector:"Sud",date:addDays(2),start:"08:20",end:"08:50",needed:4,desc:"Tracts à récupérer chez Nadia la veille.",status:"open"},
  {id:2,by:3,name:"Julien M.",phone:"06 00 00 00 03",consent:false,type:"Affichage",title:"Tournée d'affichage avenue des Tilleuls",place:"Commerces de l'avenue des Tilleuls",sector:"Nord",date:addDays(3),start:"17:00",end:"19:00",needed:3,desc:"20 affiches A3 et du scotch fournis.",status:"open"},
  {id:3,by:2,name:"Nadia B.",phone:"06 00 00 00 02",consent:true,type:"Présence au groupe de travail",title:"Réunion de concertation du secteur Sud",place:"Préau de l'école du Moulin",sector:"Sud",date:addDays(5),start:"18:30",end:"",needed:null,desc:"Venir nombreux. Participer n'engage pas à endosser les résultats.",status:"open"},
  {id:4,by:4,name:"Sofia L.",phone:"",consent:false,type:"Rassemblement",title:"Rassemblement devant la mairie",place:"Place de la mairie",sector:"",date:addDays(9),start:"",end:"",needed:null,desc:"Horaire à confirmer.",status:"open"},
  {id:5,by:3,name:"Julien M.",phone:"06 00 00 00 03",consent:false,type:"Tractage",title:"Tractage au marché du samedi",place:"Marché de la place du Parc",sector:"Nord",date:addDays(4),start:"10:00",end:"12:00",needed:3,desc:"",status:"cancelled",cancelMsg:"Reporté à cause de la pluie annoncée."},
  {id:6,by:2,name:"Nadia B.",phone:"06 00 00 00 02",consent:true,type:"Tractage",title:"Tractage à la sortie de l'école du Moulin",place:"Devant l'école du Moulin",sector:"Sud",date:addDays(-3),start:"16:30",end:"17:00",needed:4,desc:"",status:"open"},
  {id:7,by:3,name:"Julien M.",phone:"06 00 00 00 03",consent:false,type:"Affichage",title:"Affichage dans les commerces du quartier Nord",place:"Rue du Parc",sector:"Nord",date:addDays(-6),start:"18:00",end:"19:30",needed:3,desc:"",status:"open"},
  {id:8,by:4,name:"Sofia L.",phone:"",consent:false,type:"Rassemblement",title:"Rassemblement devant le rectorat",place:"Parvis du rectorat",sector:"",date:addDays(-10),start:"12:00",end:"",needed:null,desc:"",status:"cancelled",cancelMsg:"Remplacé par une délégation reçue en audience."}
];
let avail=[{a:1,u:3,c:"Je peux apporter 50 tracts de plus."},{a:1,u:5},{a:2,u:4},{a:3,u:3},{a:3,u:4},{a:3,u:5},{a:5,u:4},{a:6,u:1},{a:6,u:3},{a:6,u:5},{a:7,u:3},{a:7,u:4}];
let mails=[];

// ---------- état ----------
let me=null, view="login", param=null, fSector="", fType="", otp=null, flash={}, pendingInvite=null, prefill=null;
const pubName=(f,l)=>{f=(f||"").trim();l=(l||"").trim();return l?f+" "+l.charAt(0).toUpperCase()+".":f;};
const fullName=u=>((u.first||"")+" "+(u.last||"")).trim()||u.name;
const isMember=()=>me&&me.role!=="pending";
const isMod=()=>me&&(me.role==="moderator"||me.role==="admin");
const isAdmin=()=>me&&me.role==="admin";
const go=(v,p)=>{if(v!==view)flash={};view=v;param=p;render();try{window.scrollTo(0,0);}catch(e){}};
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400);};
const userById=id=>users.find(u=>u.id===id);
// Identifiant public aléatoire (12 caractères hexadécimaux), comme sur le site réel.
const refOf=a=>a.ref||(a.ref=Array.from({length:12},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join(""));
const actionUrl=a=>SITE+"/action/"+refOf(a);

// ---------- e-mails simulés ----------
function sendMail(u,subject,body){ if(!u) return; mails.unshift({to:u.email,name:u.name,subject,body,at:new Date()}); renderMailBtn(); }
function renderMailBtn(){ document.getElementById("mailbtn").textContent="E-mails envoyés ("+mails.length+")"; const box=document.getElementById("mailbox"); if(box.classList.contains("on")) renderMailbox(); }
function renderMailbox(){
  document.getElementById("mailbox").innerHTML=`<div class="row"><h2 style="margin:0">E-mails envoyés</h2><span class="spacer"></span><button class="link" id="mailclose">Fermer</button></div>
  <p class="small muted">Démonstration&nbsp;: sur le site réel, ces messages partent vraiment par e-mail.</p>
  ${mails.length?mails.map(m=>`<div class="mail"><b>${esc(m.subject)}</b><span class="muted">À ${esc(m.name)} &lt;${esc(m.to)}&gt;</span><div>${esc(m.body).replace(/\n/g,"<br>")}</div></div>`).join(""):`<p class="muted">Aucun e-mail pour l'instant.</p>`}`;
  document.getElementById("mailclose").onclick=()=>document.getElementById("mailbox").classList.remove("on");
}
document.getElementById("mailbtn").onclick=()=>{const b=document.getElementById("mailbox");b.classList.toggle("on");renderMailbox();};
const resume=a=>a.title+"\n"+longDate(a.date)+", "+horaire(a)+"\n"+a.place+"\n"+actionUrl(a);
function notifyChange(a,kind){
  const ids=avail.filter(x=>x.a===a.id).map(x=>x.u).filter(id=>id!==me.id);
  ids.map(userById).filter(u=>u&&u.notif.changes).forEach(u=>{
    if(kind==="cancel") sendMail(u,"Action annulée : "+a.title,"L'action à laquelle vous étiez inscrit est annulée."+(a.cancelMsg?"\nMessage du responsable : "+a.cancelMsg:"")+"\n\n"+resume(a));
    else sendMail(u,"Action modifiée : "+a.title,"L'action à laquelle vous êtes inscrit a été modifiée. Nouvelles informations :\n\n"+resume(a));
  });
  return ids.length;
}

function signUp(a,c){avail.push({a:a.id,u:me.id,c:c||""});const p=userById(a.by);
  if(p&&p.id!==me.id&&p.notif.inscrits) sendMail(p,"Nouvel inscrit : "+a.title,me.name+" est disponible pour votre action.\n"+count(a)+" personne(s) inscrite(s)"+(a.needed?" sur "+a.needed+" souhaitées":"")+"."+(c?"\n\nSon message : « "+c+" »":"")+"\n\n"+resume(a));
  toast("Vous êtes inscrit"+(p&&p.id!==me.id?" – "+p.name+" est prévenu(e)":""));}
function transfer(a,to){const from=userById(a.by);a.by=to.id;a.name=to.name;a.phone=to.phone;a.consent=false;
  sendMail(to,"Vous êtes responsable de : "+a.title,me.name+" vous a confié la responsabilité de cette action. Vous pouvez désormais la modifier, l'annuler ou la transférer, et vous recevrez les inscriptions.\n\nVotre numéro n'est pas affiché tant que vous ne l'avez pas accepté.\n\n"+resume(a));
  if(from&&from.id!==me.id) sendMail(from,"Responsabilité transférée : "+a.title,me.name+" a confié la responsabilité de cette action à "+to.name+".\n\n"+resume(a));
  avail.filter(x=>x.a===a.id&&![to.id,from&&from.id,me.id].includes(x.u)).map(x=>userById(x.u)).filter(u=>u&&u.notif.changes).forEach(u=>sendMail(u,"Nouveau responsable : "+a.title,"Le responsable de cette action est désormais "+to.name+".\n\n"+resume(a)));}

let recSector="";
function recapText(sec){
  const from=addDays(0), to=addDays(6), cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const ML=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const longDate=iso=>{const x=d(iso);return JOURS[x.getDay()]+" "+x.getDate()+NB+ML[x.getMonth()];};
  const rows=actions.filter(a=>a.date>=from&&a.date<=to&&(!sec||a.sector===sec||!a.sector)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  const TE=typeEmoji;
  const L=["📣 *Actions à venir – "+(sec?"secteur "+sec:"tous secteurs")+"*","Du "+longDate(from)+" au "+longDate(to)];
  if(!rows.length){L.push("","Aucune action prévue pour le moment. Proposez-en une : "+SITE+"/proposer");return L.join("\n");}
  let day=null;
  rows.forEach(a=>{
    if(a.date!==day){day=a.date;L.push("","📅 *"+cap(longDate(day))+"*");}
    const head=horaire(a)+" · "+(a.title.toLowerCase().startsWith(a.type.toLowerCase())?a.title:a.type+" – "+a.title);
    if(a.status==="cancelled"){L.push("❌ ~"+head+"~ (annulée)");return;}
    const n=count(a), need=a.needed||0;
    L.push(TE(a.type)+" "+head,"   📍 "+a.place,"   "+(need&&n<need?"🙋 "+n+" inscrit"+(n>1?"s":"")+" sur "+need+" : *il manque "+(need-n)+NB+"personne"+(need-n>1?"s":"")+"*":need?"✅ Complet ("+n+" inscrit"+(n>1?"s":"")+")":"🙋 "+(n?n+" inscrit"+(n>1?"s":""):"Pas encore d'inscrit")),"   👉 "+actionUrl(a));
  });
  L.push("","👉 Pour vous inscrire, ouvrez le lien de l'action et cliquez sur « Je suis disponible ».");
  return L.join("\n");
}
function count(a){return avail.filter(x=>x.a===a.id).length;}
const isPast=a=>a.date<addDays(0);
function myComment(a){return (avail.find(x=>x.a===a.id&&x.u===me.id)||{}).c||"";}
function amIn(a){return avail.some(x=>x.a===a.id&&x.u===me.id);}
function toggleBtn(a,long){
  if(a.status==="cancelled") return `<span class="tag t-alert">Annulée</span>`;
  return amIn(a)?`<button class="ok" data-act="toggle" data-a="${a.id}">✓ Je suis disponible${long?" – me retirer":""}</button>`:`<button class="primary" data-act="toggle" data-a="${a.id}">Je suis disponible</button>`;
}
function actionCard(a){
  const n=count(a), x=d(a.date), fill=a.needed?Math.min(100,Math.round(n/a.needed*100)):0, past=isPast(a);
  return `<div class="card action ${a.status==="cancelled"?"cancelled":""}">
    <div class="date"><span>${JOURS[x.getDay()].slice(0,3)}.</span><b>${x.getDate()}</b><span>${MOIS[x.getMonth()]}</span></div>
    <div><div class="row" style="gap:6px;margin-bottom:4px"><span class="tag t-type">${esc(a.type)}</span>${secTag(a.sector)||'<span class="tag t-type">Tous secteurs</span>'}</div>
      <h3><a href="#" data-go="detail" data-p="${a.id}" style="color:inherit">${esc(a.title)}</a></h3>
      <div class="meta">${esc(horaire(a))} · ${esc(a.place)}</div>
      <div class="meta">Responsable&nbsp;: ${esc(a.name)}</div>
      ${a.status==="cancelled"&&a.cancelMsg?`<div class="meta small">Annulée&nbsp;: ${esc(a.cancelMsg)}</div>`:""}</div>
    <div class="side">${past?(a.status==="cancelled"?`<span class="tag t-alert">Annulée</span>`:`<div class="count">${n} participant${n>1?"s":""}${amIn(a)?" dont vous":""}</div>`):toggleBtn(a)}
      ${a.status!=="cancelled"&&!past?`<div class="count">${n} disponible${n>1?"s":""}${a.needed?` sur ${a.needed} souhaités`:""}</div>${a.needed?`<div class="bar-fill"><i style="width:${fill}%"></i></div>`:""}`:""}
    </div></div>`;
}
const tabs=on=>`<div class="tabs"><a href="#" data-go="list" class="${on==="list"?"on":""}">À venir</a><a href="#" data-go="past" class="${on==="past"?"on":""}">Passées</a></div>`;

    <label class="small">Secteur&nbsp;: <select id="fs"><option value="">Tous</option>${SECTORS.map(s=>`<option ${s===fSector?"selected":""}>${s}</option>`).join("")}</select></label>

  </div>`;
const filtered=()=>actions.filter(a=>(!fSector||a.sector===fSector||!a.sector)&&(!fType||a.type===fType));
V.past=()=>{
  const rows=filtered().filter(isPast).sort((a,b)=>(b.date+(b.start||"")).localeCompare(a.date+(a.start||"")));
  const tenues=rows.filter(a=>a.status!=="cancelled"), part=tenues.reduce((t,a)=>t+count(a),0);

  <p class="small muted">Les actions passées sont conservées 90${NB}jours, puis supprimées avec la liste des participants.</p>`;

V.list=()=>{
  const rows=filtered().filter(a=>!isPast(a)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  return `<div class="row"><h1>Actions à venir</h1><span class="spacer"></span><button class="primary" data-go="new">Proposer une action</button></div>${tabs("list")}
  <div class="filters">

    <label class="small">Type&nbsp;: <select id="ft"><option value="">Tous</option>${TYPES.map(s=>`<option ${s===fType?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
  </div>${rows.length?rows.map(actionCard).join(""):`<p class="muted">Aucune action ne correspond à ces filtres.</p>`}`;
};
const typeEmoji=t=>{t=t.toLowerCase();for(const [k,e] of [["tract","📄"],["affich","📌"],["rassembl","✊"],["manif","✊"],["réunion","🗣️"],["concertation","🗣️"],["groupe de travail","🗣️"]]) if(t.includes(k)) return e; return "🔹";};
const ML_SHARE=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function shareText(a,wa=true){const x=d(a.date),j=JOURS[x.getDay()],n=count(a),need=a.needed||0;
  const L=[typeEmoji(a.type)+" "+(wa?"*"+a.title+"*":a.title),"📅 "+j.charAt(0).toUpperCase()+j.slice(1)+" "+x.getDate()+NB+ML_SHARE[x.getMonth()]+", "+horaire(a),"📍 "+a.place];
  if(need>n) L.push("🙋 Il manque "+(need-n)+NB+"personne"+(need-n>1?"s":"")+" ("+n+" sur "+need+")");
  L.push("👉 Inscrivez-vous : "+actionUrl(a)); return L.join("\n");}
function icsOf(a){
  const pad=n=>String(n).padStart(2,"0"), ymd=a.date.replace(/-/g,""), t=s=>s.replace(":","")+"00";
  let dt;
  if(a.start){const end=a.end||(pad(Math.min(23,Number(a.start.slice(0,2))+1))+a.start.slice(2));
    dt="DTSTART;TZID=Europe/Paris:"+ymd+"T"+t(a.start)+"\r\nDTEND;TZID=Europe/Paris:"+ymd+"T"+t(end);}
  else dt="DTSTART;VALUE=DATE:"+ymd+"\r\nDTEND;VALUE=DATE:"+nextDay(a.date).replace(/-/g,"");
  const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Actions militantes//Demo//FR","BEGIN:VEVENT","UID:action-"+refOf(a)+"@actions.exemple.fr",
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt,"SUMMARY:"+e(a.title),"LOCATION:"+e(a.place),
    "DESCRIPTION:"+e((a.desc?a.desc+"\n":"")+actionUrl(a)),"URL:"+actionUrl(a),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
V.detail=()=>{
  const a=actions.find(x=>x.id===param); if(!a) return `<p>Action introuvable.</p>`;

  return `<p><a href="#" data-go="${past?"past":"list"}">← ${past?"Actions passées":"Toutes les actions"}</a></p>

    ${open?`<div class="share">
      <a class="btn" href="https://wa.me/?text=${encodeURIComponent(shareText(a))}" target="_blank" rel="noopener">Partager sur WhatsApp</a>
      <a class="btn" href="mailto:?subject=${encodeURIComponent(typeEmoji(a.type)+" "+a.title+" – "+longDate(a.date))}&body=${encodeURIComponent(shareText(a,false))}">Partager par e-mail</a>
      <button data-act="ics" data-a="${a.id}">Ajouter à mon agenda (.ics)</button>
      <button data-act="copy" data-a="${a.id}">Copier le message</button></div>

    <div id="icsbox"></div>`:""}
    <div class="row" style="margin-top:12px">${open&&amIn(a)?toggleBtn(a,true):""}
      ${canEdit?`<span class="spacer"></span>${open?`<button data-act="edit" data-a="${a.id}">Modifier</button><button data-act="cancel" data-a="${a.id}">Annuler l'action</button>`:`<button data-act="reopen" data-a="${a.id}">Rétablir</button>`}<button data-act="dup" data-a="${a.id}">Dupliquer</button>`:`<span class="spacer"></span><button data-act="dup" data-a="${a.id}">Dupliquer</button>`}</div>
    ${open&&!amIn(a)?`<div class="row" style="margin-top:12px"><button class="primary" data-act="toggle" data-a="${a.id}">Je suis disponible</button></div>`:""}
    ${open&&amIn(a)?`<details style="margin-top:12px" ${myComment(a)?"open":""}><summary style="cursor:pointer;font-weight:600;color:var(--accent)">${myComment(a)?"Mon message au responsable":"Ajouter un message pour le responsable"}</summary>
      <form id="msgf" class="card" style="margin:10px 0 0;background:var(--bg)"><label>Message pour ${esc(a.name)}</label>
      <textarea name="c" maxlength="300" rows="2">${esc(myComment(a))}</textarea>
      <p class="hint">Seuls le responsable de l'action et les modérateurs le liront. Laissez vide pour le retirer.</p>
      <div class="row" style="margin-top:10px"><button type="submit">Enregistrer le message</button></div></form></details>`:""}
    ${canEdit?`<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;color:var(--accent)">Transférer la responsabilité</summary>
      <form id="transf" class="card" style="margin:10px 0 0;background:var(--bg)"><label>Nouveau responsable</label>
      <select name="u" required><option value=""></option>${SECTORS.concat([""]).map(sec=>{const list=users.filter(x=>x.role!=="pending"&&x.id!==a.by&&sectorOf(x.school)===sec).sort((x,y)=>x.name.localeCompare(y.name,"fr"));
        return list.length?`<optgroup label="${sec?"Secteur "+esc(sec):"Sans secteur"}">${list.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</optgroup>`:"";}).join("")}</select>
      <p class="hint">Le nouveau responsable est prévenu par e-mail, ainsi que les inscrits. Son numéro n'est affiché qu'après son propre accord.</p>
      <div class="row" style="margin-top:10px"><button class="primary" type="submit">Transférer</button></div></form></details>`:""}
    <div id="cancelbox"></div>
  </div>
  <div class="card"><h2>${past?"Participants":"Disponibles"} (${people.length}${a.needed?` sur ${a.needed} souhaités`:""})</h2>
    ${people.length?`<ul class="people">${people.map(u=>{const c=(avail.find(x=>x.a===a.id&&x.u===u.id)||{}).c;return `<li>${esc(u.name)}${(a.by===me.id||isMod())&&u.phone?` <span class="muted small">– ${esc(u.phone)}</span>`:""}${c&&(a.by===me.id||isMod()||u.id===me.id)?`<div class="small muted" style="font-style:italic">«${NB}${esc(c)}${NB}»</div>`:""}</li>`;}).join("")}</ul>`:`<p class="muted">Personne pour l'instant.</p>`}
    <p class="small muted">Les numéros des personnes disponibles et leurs messages ne sont visibles que par le responsable de l'action et les modérateurs.</p></div>`;
};
function form(a,isNew){
  a=a||{name:me.name,phone:me.phone,consent:false,sector:sectorOf(me.school)};
  const opt=(list,v)=>list.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("");
  return `<form id="f" class="card" data-id="${isNew?"":(a.id||"")}">
    <div class="grid2">
      <div><label>Responsable</label><p style="margin:6px 0"><strong>${esc(a.name||me.name)}</strong> <span class="small muted">(prénom et initiale du nom, d'après le compte)</span></p></div>
      <div><label>Téléphone</label><input name="phone" type="tel" value="${esc(a.phone)}" placeholder="06 12 34 56 78"></div>
    </div>
    <label class="check"><input type="checkbox" name="consent" ${a.consent?"checked":""}> J'accepte que mon numéro soit visible par les membres validés du site, pour que les personnes intéressées par l'action puissent me joindre facilement.</label>
    <div class="grid2">
      <div><label>Type d'action</label><select name="type" required>${opt(TYPES,a.type)}</select></div>
      <div><label>Secteur</label><select name="sector"><option value="">Tous secteurs</option>${opt(SECTORS,a.sector)}</select></div>
    </div>
    <label>Intitulé</label><input name="title" required value="${esc(a.title)}" placeholder="Tractage devant la gare…">
    <label>Lieu</label><input name="place" required value="${esc(a.place)}" placeholder="Place du marché, adresse…">
    <div class="grid2">
      <div><label>Date</label><input name="date" type="date" required value="${esc(a.date||addDays(1))}"></div>
      <div class="grid2" style="gap:0 10px"><div><label>Début</label><input name="start" type="time" value="${esc(a.start)}"></div><div><label>Fin</label><input name="end" type="time" value="${esc(a.end)}"></div></div>
    </div>
    ${isNew?`<label>Répéter (facultatif)</label><select name="repeat"><option value="0">Une seule fois</option><option value="1">Aussi le lendemain</option><option value="4">Tous les jours jusqu'au vendredi suivant</option><option value="7">Le même jour la semaine suivante</option></select>
    <p class="hint">Crée des actions séparées, chacune avec sa propre liste d'inscrits.</p>`:""}
    <label>Nombre de personnes souhaité (facultatif)</label><input name="needed" type="number" min="1" value="${esc(a.needed||"")}">
    <label>Précisions</label><textarea name="desc" placeholder="Point de rendez-vous, matériel, consignes…">${esc(a.desc)}</textarea>
    ${!isNew&&count(a)?`<p class="hint">Les ${count(a)}${NB}personnes inscrites recevront un e-mail avec les nouvelles informations.</p>`:""}
    <div class="row" style="margin-top:16px"><button class="primary" type="submit">${isNew?"Publier l'action":"Enregistrer"}</button><button type="button" data-go="list">Annuler</button></div>
  </form>`;
}
V.new=()=>`<h1>${prefill?"Dupliquer une action":"Proposer une action"}</h1><p class="muted">${prefill?"Les informations sont reprises&nbsp;; vérifiez la date avant de publier.":"Elle sera visible immédiatement par les membres validés."}</p>${form(prefill,true)}`;
V.edit=()=>`<h1>Modifier l'action</h1>${form(actions.find(x=>x.id===param),false)}`;
V.mine=()=>{
  const mine=avail.filter(x=>x.u===me.id).map(x=>actions.find(a=>a.id===x.a)).filter(a=>a&&!isPast(a));
  const prop=actions.filter(a=>a.by===me.id&&!isPast(a));
  return `<h1>Mes disponibilités</h1>${mine.length?mine.map(actionCard).join(""):`<p class="muted">Vous ne vous êtes inscrit à aucune action.</p>`}
  <h1 style="margin-top:24px">Actions dont je suis responsable</h1>${prop.length?prop.map(actionCard).join(""):`<p class="muted">Vous n'êtes responsable d'aucune action.</p>`}`;
};
V.account=()=>`<h1>Mon compte</h1><form id="acc" class="card">
  <div class="row"><div style="flex:1;min-width:120px"><label>Prénom</label><input name="first" required value="${esc(me.first)}"></div><div style="flex:1;min-width:120px"><label>Nom</label><input name="last" required value="${esc(me.last)}"></div></div>
  <p class="hint">Affiché aux autres membres sous la forme «${NB}${esc(me.name)}${NB}» (prénom et initiale du nom). Les responsables voient votre nom complet.</p>
  <label>Téléphone (prérempli quand vous proposez une action)</label><input name="phone" type="tel" value="${esc(me.phone)}">
  <label>Votre établissement</label>${schoolSelect("school",me.school,"Non précisée")}
  <p class="hint" id="sec-hint">${me.school?`Secteur&nbsp;: ${secTag(sectorOf(me.school))}`:"Le secteur sera déduit de l'établissement."}</p>
  <p class="small muted">Adresse de connexion&nbsp;: ${esc(me.email)}</p>
  <h2 style="margin-top:18px">Recevoir un e-mail…</h2>
  <label class="check"><input type="checkbox" name="n_inscrits" ${me.notif.inscrits?"checked":""}> quand quelqu'un s'inscrit à une action que j'ai proposée</label>
  <label class="check"><input type="checkbox" name="n_changes" ${me.notif.changes?"checked":""}> quand une action à laquelle je suis inscrit est modifiée ou annulée</label>
  <label class="check"><input type="checkbox" name="n_rappel" ${me.notif.rappel?"checked":""}> la veille d'une action à laquelle je suis inscrit (rappel)</label>
  <div class="row" style="margin-top:14px"><button class="primary" type="submit">Enregistrer</button></div></form>
  <div class="card"><h2>Supprimer mon compte</h2><p class="small muted">Vos disponibilités et les actions que vous avez proposées seront supprimées définitivement.</p>
  <button data-act="delme">Supprimer mon compte</button></div>`;
V.admin=()=>{
  const pend=users.filter(u=>u.role==="pending"), others=users.filter(u=>u.role!=="pending");
  const mySec=sectorOf(me.school);
  return `<h1>Modération</h1>
  <p class="muted small">Les modérateurs (responsables de secteur) valident les comptes arrivés sans lien d'invitation, modifient, annulent ou suppriment les actions, et peuvent nommer d'autres modérateurs. Les administrateurs gèrent en plus les paramètres et les liens d'invitation.</p>
  <div class="card"><h2>Comptes en attente (${pend.length})</h2>
    ${pend.length?`<table><tr><th>Nom</th><th>Adresse</th><th>Établissement</th><th></th></tr>${pend.map(u=>`<tr><td>${esc(fullName(u))}</td><td>${esc(u.email)}</td><td>${u.school?esc(u.school)+" "+secTag(sectorOf(u.school)):`<span class="muted small">Non précisée</span>`}</td><td class="row"><button class="ok" data-act="approve" data-u="${u.id}">Valider</button><button class="link" data-act="refuse" data-u="${u.id}">Refuser</button></td></tr>`).join("")}</table>`:`<p class="muted">Aucun compte en attente.</p>`}
    ${mySec&&!isAdmin()?`<p class="small muted">Pour éviter d'avoir à valider chaque compte, partagez le lien d'invitation du secteur ${esc(mySec)} dans son groupe WhatsApp. Demandez-le à un administrateur.</p>`:""}</div>
  <div class="card"><h2>Membres (${others.length})</h2><table><tr><th>Nom</th><th>Établissement</th><th>Arrivé par</th><th>Rôle</th></tr>
    ${others.map(u=>`<tr><td>${esc(fullName(u))}<div class="small muted">${esc(u.email)}${u.name!==fullName(u)?` · affiché «${NB}${esc(u.name)}${NB}»`:""}</div>${isAdmin()?`<details><summary class="small" style="cursor:pointer;color:var(--muted)">Corriger le nom</summary><form class="namefix row" data-u="${u.id}" style="margin-top:6px;flex-wrap:nowrap"><input name="first" required value="${esc(u.first||"")}" placeholder="Prénom" style="min-width:0"><input name="last" required value="${esc(u.last||"")}" placeholder="Nom" style="min-width:0"><button type="submit">OK</button></form></details>`:""}</td><td>${isAdmin()?`<select data-act="usersch" data-u="${u.id}"><option value="">Non précisé</option>${SECTORS.map(s=>`<optgroup label="Secteur ${esc(s)}">${schools.filter(x=>x.s===s).sort((a,b)=>a.n.localeCompare(b.n,"fr")).map(x=>`<option ${x.n===u.school?"selected":""}>${esc(x.n)}</option>`).join("")}</optgroup>`).join("")}</select> `:esc(u.school)+" "}${secTag(sectorOf(u.school))}</td><td class="small">${u.inviteSector?"Lien "+esc(u.inviteSector):"Validation"}</td><td>
      <select data-act="role" data-u="${u.id}" ${u.id===me.id||(u.role==="admin"&&!isAdmin())?"disabled":""}>${[["member","Membre"],["moderator","Modérateur"],["admin","Administrateur"]].filter(([k])=>k!=="admin"||isAdmin()||u.role==="admin").map(([k,l])=>`<option value="${k}" ${u.role===k?"selected":""}>${l}</option>`).join("")}</select>
      ${u.id!==me.id&&u.role!=="admin"?`<button class="link small" data-act="block" data-u="${u.id}">Retirer l'accès</button>`:""}</td></tr>`).join("")}</table>
    ${isAdmin()?`<p class="small muted">Le secteur d'une personne est celui de son établissement${NB}: pour la changer de secteur, choisissez un établissement de l'autre secteur.</p>`:""}
    <p class="small muted">«${NB}Retirer l'accès${NB}» remet le compte en attente, par exemple pour une personne arrivée par un lien qui aurait fuité.</p></div>
  <div class="card"><h2>Message WhatsApp</h2><p class="small muted">Les actions des 7 prochains jours, mises en forme pour un groupe WhatsApp, avec les besoins en personnes et les liens d'inscription. Sans nom ni numéro de téléphone.</p>
    <div class="filters"><label class="small">Secteur&nbsp;: <select id="recsec"><option value="">Tous</option>${SECTORS.map(s=>`<option ${s===recSector?"selected":""}>${s}</option>`).join("")}</select></label></div>
    <textarea readonly rows="14" style="display:block;width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;margin-top:8px">${esc(recapText(recSector))}</textarea>
    <div class="row" style="margin-top:10px"><button class="primary" data-act="copyrecap">Copier le message</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(recapText(recSector))}">Ouvrir dans WhatsApp</a></div>
    <p class="hint">Les *astérisques* s'affichent en gras et les ~tildes~ barrent le texte dans WhatsApp.</p></div>
  <div class="card"><h2>Récapitulatif</h2><p class="small muted">Sur le site réel, ce bouton télécharge un fichier CSV (ouvrable dans Excel) de toutes les actions à venir avec leurs inscrits, pour le diffuser dans les groupes WhatsApp.</p>
    <button data-act="csv">Exporter le récapitulatif</button></div>`;
};
V.settings=()=>`<h1>Paramètres</h1><p class="muted">Réservé aux administrateurs.</p>
  <div class="card"><h2>Nom du site et logo</h2>
    <form id="namef" class="row" style="align-items:flex-end"><div style="flex:1;min-width:200px"><label>Nom du site</label><input name="n" maxlength="80" value="${esc(siteName)}"></div><button type="submit">Enregistrer</button></form>
    <p class="hint">Affiché en haut de chaque page, dans l'onglet du navigateur et au bas des e-mails.</p>
    <div class="row" style="align-items:flex-end;margin-top:12px">${siteLogo?`<img src="${siteLogo}" alt="Logo actuel" style="max-height:96px;max-width:200px;border:1px solid var(--line);border-radius:8px;padding:6px">`:""}
      <div style="flex:1;min-width:200px"><label>${siteLogo?"Remplacer le logo":"Logo"}</label><input id="logofile" type="file" accept="image/png,image/jpeg,image/webp"></div></div>
    <p class="hint">PNG, JPEG ou WebP, 2${NB}Mo au plus. Une image carrée rend mieux${NB}: le logo sert aussi d'icône dans l'onglet du navigateur. Dans la démo, il n'est pas enregistré.</p>
    ${siteLogo?`<button class="link" data-act="dellogo">Retirer le logo</button>`:""}</div>
  <div class="card"><h2>Liens d'invitation</h2>
    <div class="alert"><strong>Attention.</strong> Toute personne qui ouvre un lien d'invitation obtient un compte validé, sans contrôle d'un responsable. Ne le partagez que dans le groupe WhatsApp du secteur, jamais sur un tract, une affiche ou un réseau social. S'il circule au-delà, réinitialisez-le&nbsp;: l'ancien lien cesse aussitôt de fonctionner, et les comptes déjà créés restent actifs (vous pouvez leur retirer l'accès dans Modération).</div>
    ${SECTORS.map(s=>{const iv=invites[s];return `<div style="margin:14px 0"><div class="row" style="margin-bottom:6px">${secTag(s)}<span class="small muted">Créé le ${esc(longDate(iv.since))} · ${iv.used}${NB}compte${iv.used>1?"s":""} créé${iv.used>1?"s":""} avec ce lien</span></div>
      <div class="linkbox"><code>${esc(inviteUrl(s))}</code><button data-act="copyinv" data-s="${esc(s)}">Copier</button><button data-act="resetinv" data-s="${esc(s)}">Réinitialiser</button></div></div>`;}).join("")}
  </div>
  <div class="card"><h2>Secteurs</h2>
    <table><tr><th>Secteur</th><th>Établissements</th><th></th></tr>${SECTORS.map(s=>`<tr><td>${secTag(s)}</td><td>${schools.filter(x=>x.s===s).length}</td>
      <td>${schools.some(x=>x.s===s)?`<span class="small muted">Déplacez ses établissements avant de le supprimer</span>`:`<button class="link" data-act="delsec" data-s="${esc(s)}">Supprimer</button>`}</td></tr>`).join("")}</table>
    <form id="secf" class="row" style="margin-top:10px;align-items:flex-end"><div><label>Nouveau secteur</label><input name="s" required placeholder="Centre" style="width:120px"></div><button type="submit">Ajouter</button></form>
    <p class="hint">Un lien d'invitation est créé automatiquement pour chaque nouveau secteur.</p></div>
  <div class="card"><h2>Établissements (${schools.length})</h2>
    <p class="small muted">Changer un établissement de secteur met à jour le secteur de tous les comptes qui y sont rattachés. Le renommer ne change rien d'autre : comptes, référent et fiche sont conservés.</p>
    <table><tr><th>Établissement</th><th>Secteur</th><th>Comptes</th><th></th></tr>${[...schools].sort((a,b)=>a.s.localeCompare(b.s)||a.n.localeCompare(b.n,"fr")).map(x=>{const n=users.filter(u=>u.school===x.n).length;return `<tr>
      <td><a href="#" data-go="school" data-p="${x.id}">${esc(x.n)}</a>
        <details><summary class="small" style="cursor:pointer;color:var(--muted)">Renommer</summary><form class="renf row" data-id="${x.id}" style="margin-top:6px;flex-wrap:nowrap"><input name="n" required maxlength="120" value="${esc(x.n)}" style="min-width:0"><button type="submit">OK</button></form></details></td><td><select data-act="schsec" data-n="${esc(x.n)}">${SECTORS.map(s=>`<option ${s===x.s?"selected":""}>${s}</option>`).join("")}</select></td><td>${n}</td>
      <td>${n?"":`<button class="link" data-act="delsch" data-n="${esc(x.n)}">Supprimer</button>`}</td></tr>`;}).join("")}</table>
    <form id="schf" class="row" style="margin-top:10px;align-items:flex-end"><div style="flex:1;min-width:200px"><label>Nouvel établissement</label><input name="n" required placeholder="Nouvel établissement (rentrée 2027)"></div>
      <div><label>Secteur</label><select name="s">${SECTORS.map(s=>`<option>${s}</option>`).join("")}</select></div><button type="submit">Ajouter</button></form></div>
  <div class="card"><h2>Types d'action</h2>
    <div class="row">${TYPES.map(t=>`<span class="tag t-type" style="padding:4px 10px">${esc(t)} <button class="link" data-act="deltype" data-t="${esc(t)}" title="Retirer">×</button></span>`).join("")}</div>
    <form id="typef" class="row" style="margin-top:10px;align-items:flex-end"><div><label>Nouveau type</label><input name="t" required placeholder="Pique-nique revendicatif"></div><button type="submit">Ajouter</button></form></div>
  <div class="card"><h2>Conservation des données</h2><p>Les actions passées sont supprimées automatiquement au bout de <strong>90${NB}jours</strong>, avec les disponibilités associées. Ce délai se règle dans le fichier de configuration du serveur.</p></div>`;
V.schools=()=>{
  const rows=schools.filter(x=>!fSector||x.s===fSector).sort((a,b)=>a.s.localeCompare(b.s)||a.n.localeCompare(b.n,"fr"));
  const missing=rows.filter(x=>!x.ref).length;
  return `<h1>Établissements</h1><p class="muted small">Chaque établissement peut avoir un référent, membre du site, et un point de dépôt du matériel. Le numéro d'un référent n'est affiché qu'avec son accord.</p>
  <div class="filters"><label class="small">Secteur&nbsp;: <select id="fs"><option value="">Tous</option>${SECTORS.map(s=>`<option ${s===fSector?"selected":""}>${s}</option>`).join("")}</select></label></div>
  <p class="small">${rows.length}${NB}établissement${rows.length>1?"s":""}${missing?`, dont <strong>${missing}${NB}sans référent</strong>`:", tous avec un référent"}.</p>
  <div class="card"><table><tr><th>Établissement</th><th>Secteur</th><th>Référent</th><th>Téléphone</th><th>Point de dépôt</th></tr>
  ${rows.map(x=>{const r=x.ref&&userById(x.ref),t=refPhone(x);return `<tr><td><a href="#" data-go="school" data-p="${x.id}">${esc(x.n)}</a></td><td>${secTag(x.s)}</td>
    <td>${r?esc(r.name)+(r.id===me.id?' <span class="small muted">(vous)</span>':""):'<span class="tag t-alert">À trouver</span>'}</td><td>${t?telLink(t):""}</td><td class="small">${esc(x.depot)}</td></tr>`;}).join("")}</table></div>`;
};
V.school=()=>{
  const x=schoolById(param); if(!x) return `<p>Établissement introuvable.</p>`;
  const r=x.ref&&userById(x.ref), isRef=!!r&&r.id===me.id, canEdit=isMod()||isRef, t=refPhone(x);
  const nb=users.filter(u=>u.school===x.n&&u.role!=="pending").length;
  const consentBox=checked=>me.phone?`<label class="check"><input type="checkbox" name="consent" value="1" ${checked?"checked":""}> J'accepte que mon numéro (${esc(me.phone)}) soit visible par les membres validés du site.</label>`:`<p class="hint">Aucun numéro dans votre compte. Ajoutez-le dans <a href="#" data-go="account">Mon compte</a> si vous souhaitez l'afficher.</p>`;
  const sum=l=>`<summary style="cursor:pointer;font-weight:600;color:var(--accent)">${l}</summary>`;
  const box='class="card" style="margin:10px 0 0;background:var(--bg)"';
  const next=actions.filter(a=>!isPast(a)&&(a.sector===x.s||!a.sector)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||""))).slice(0,5);
  return `<p><a href="#" data-go="schools">← Retour aux établissements</a></p>
  <div class="card"><div class="row" style="gap:6px">${secTag(x.s)}<span class="small muted">${nb}${NB}membre${nb>1?"s":""} rattaché${nb>1?"s":""}</span></div>
    <h1 style="margin-top:6px">${esc(x.n)}</h1>
    <dl class="fiche"><dt>Référent</dt><dd>${r?esc(r.name)+(isRef?' <span class="small muted">(vous)</span>':"")+(t?" – "+telLink(t):isRef?"":' <span class="small muted">(numéro non communiqué)</span>'):'<span class="tag t-alert">À trouver</span>'}</dd>
      <dt>Point de dépôt</dt><dd>${x.depot?esc(x.depot):'<span class="muted">Non renseigné</span>'}</dd>
      <dt>Notes</dt><dd>${x.notes?esc(x.notes).replace(/\n/g,"<br>"):'<span class="muted">Aucune</span>'}</dd></dl>
    ${x.upd?`<p class="small muted">Fiche mise à jour le ${esc(longDate(x.upd).replace(/\.$/,""))}.</p>`:""}
    ${!r?`<form id="devenirf" ${box}><p style="margin-top:0"><strong>Cet établissement n'a pas encore de référent.</strong> Le référent relaie les actions auprès de l'établissement et tient la fiche à jour.</p>${consentBox(false)}
      <div class="row" style="margin-top:10px"><button class="primary" type="submit">Je deviens référent</button></div></form>`:""}
    ${isRef?`<details style="margin-top:12px" ${x.consent?"":"open"}>${sum("Mon numéro sur la fiche")}<form id="consentf" ${box}>${consentBox(x.consent)}${me.phone?`<div class="row" style="margin-top:10px"><button type="submit">Enregistrer</button></div>`:""}</form></details>`:""}
    ${canEdit?`<details style="margin-top:12px">${sum("Modifier le point de dépôt et les notes")}<form id="fichef" ${box}>
      <label>Point de dépôt du matériel</label><input name="depot" maxlength="200" value="${esc(x.depot)}" placeholder="Local, commerce partenaire, lieu de rendez-vous…">
      <p class="hint">N'indiquez pas l'adresse personnelle de quelqu'un sans son accord.</p>
      <label>Notes</label><textarea name="notes" maxlength="500" rows="3">${esc(x.notes)}</textarea><p class="hint">Visibles par tous les membres validés. Aucune coordonnée personnelle.</p>
      <div class="row" style="margin-top:10px"><button class="primary" type="submit">Enregistrer</button></div></form></details>`:""}
    ${isMod()?`<details style="margin-top:12px">${sum(r?"Changer de référent":"Nommer un référent")}<form id="nommerf" ${box}><label>Référent</label>
      <select name="u"><option value="0">Aucun référent</option>${SECTORS.concat([""]).map(sec=>{const list=users.filter(u=>u.role!=="pending"&&sectorOf(u.school)===sec).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
        return list.length?`<optgroup label="${sec?"Secteur "+esc(sec):"Sans secteur"}">${list.map(u=>`<option value="${u.id}" ${u.id===x.ref?"selected":""}>${esc(u.name)}</option>`).join("")}</optgroup>`:"";}).join("")}</select>
      <p class="hint">La personne nommée est prévenue par e-mail. Son numéro n'est affiché qu'après son propre accord.</p>
      <div class="row" style="margin-top:10px"><button type="submit">Enregistrer</button></div></form></details>`:""}
    ${isRef?`<p style="margin-top:12px"><button class="link" data-act="quitref">Ne plus être référent</button></p>`:""}
  </div>
  <h2>Prochaines actions du secteur</h2>${next.length?next.map(actionCard).join(""):`<p class="muted">Aucune action à venir.</p>`}`;
};
V.privacy=()=>`<p><a href="#" data-go="${isMember()?"list":"login"}">← Retour</a></p><div class="card"><h1>Confidentialité et mentions légales</h1>
  <p class="muted small">Texte à compléter et à faire valider par un juriste.</p>
  <h2>Données collectées</h2><p>Nom, adresse e-mail, établissement, téléphone si vous le renseignez, actions proposées et disponibilités. Le numéro d'un proposant n'est affiché aux membres validés qu'avec son accord, de même que celui du référent d'un établissement, qui peut retirer cet accord à tout moment. Aucun mot de passe n'est enregistré&nbsp;: la connexion se fait par un code envoyé par e-mail.</p>
  <h2>Finalité et conservation</h2><p>Organiser les actions du collectif. Les actions passées sont supprimées au bout de 90${NB}jours&nbsp;; votre compte peut être supprimé à tout moment depuis «${NB}Mon compte${NB}».</p>
  <h2>Responsable de la publication et hébergeur</h2><p>[Nom du responsable de la publication] – [contact]. Hébergement&nbsp;: [hébergeur, adresse].</p></div>`;

  // Sur téléphone, les tableaux s'affichent en fiches : on recopie le titre de chaque colonne dans ses cellules.
function stackTables(root) {
  (root || document).querySelectorAll('table').forEach(function (t) {
    var head = t.querySelector('tr');
    if (!head || !head.querySelector('th')) return;
    head.classList.add('thead');
    var labels = Array.prototype.map.call(head.children, function (c) { return c.textContent.trim(); });
    t.querySelectorAll('tr').forEach(function (tr) {
      if (tr === head) return;
      Array.prototype.forEach.call(tr.children, function (td, i) { td.setAttribute('data-label', labels[i] || ''); });
    });
    t.classList.add('stack');
  });
}

// ---------- rendu ----------
function render(){
  if(!me){ if(!["privacy","otp","login"].includes(view)) view="login"; }
  else if(me.role==="pending" && view!=="privacy") view="pending";
  if(view==="admin" && !isMod()) view="list";
  if(view==="settings" && !isAdmin()) view="list";
  if(view!=="new") prefill=null;
  document.getElementById("main").innerHTML=(V[view]||V.list)();
  stackTables(document.getElementById("main"));
  header();
  const rs=document.getElementById("recsec"); if(rs) rs.onchange=()=>{recSector=rs.value;render();};
  const fs=document.getElementById("fs"), ft=document.getElementById("ft");
  if(fs) fs.onchange=()=>{fSector=fs.value;render();};
  if(ft) ft.onchange=()=>{fType=ft.value;render();};
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(el)),el);};};
  const newOtp=(email,isNew)=>{otp={email,isNew,code:String(Math.floor(100000+Math.random()*900000)),exp:Date.now()+10*60000,tries:0};};
  on("loginf",v=>{const email=v.email.trim().toLowerCase();const u=users.find(x=>x.email===email);newOtp(email,!u);flash={};go("otp");});
  on("otpf",v=>{const o=otp;
    if(Date.now()>o.exp){flash={err:"Ce code a expiré. Demandez-en un nouveau."};render();return;}
    if(v.code!==o.code){o.tries++;if(o.tries>=5){flash={err:"Trop d'essais : ce code est annulé. Demandez-en un nouveau."};o.code="------";}else flash={err:"Code incorrect ("+(5-o.tries)+" essai(s) restant(s))."};render();return;}
    let u=users.find(x=>x.email===o.email);
    if(!u){const f=(v.first||"").trim()||o.email.split("@")[0],l=(v.last||"").trim();u={id:Math.max(...users.map(x=>x.id))+1,name:pubName(f,l),first:f,last:l,email:o.email,phone:"",school:"",role:"pending",notif:{...NOTIF_DEFAULT}};users.push(u);}
    otp=null;me=u;
    if(pendingInvite&&u.role==="pending"){u.role="member";u.inviteSector=pendingInvite;invites[pendingInvite].used++;pendingInvite=null;go("welcome");return;}
    pendingInvite=null;toast("Connecté");go(u.role==="pending"?"pending":"list");});
  on("f",(v,f)=>{
    const rec={name:f.dataset.id?(userById(actions.find(x=>x.id===Number(f.dataset.id)).by)||me).name:me.name,phone:v.phone,consent:!!v.consent,type:v.type,sector:v.sector,title:v.title,place:v.place,date:v.date,start:v.start,end:v.end,needed:v.needed?Number(v.needed):null,desc:v.desc};
    if(f.dataset.id){const a=actions.find(x=>x.id===Number(f.dataset.id));Object.assign(a,rec);const n=notifyChange(a,"edit");toast("Action modifiée"+(n?" – "+n+" inscrit(s) prévenu(s)":""));go("detail",a.id);return;}
    const rep=Number(v.repeat||0);let dates=[rec.date];
    if(rep===1) dates.push(nextDay(rec.date));
    if(rep===4){let x=rec.date;for(let i=0;i<6;i++){x=nextDay(x);const wd=d(x).getDay();if(wd===0||wd===6) continue;dates.push(x);if(wd===5)break;}}
    if(rep===7){const x=d(rec.date);x.setDate(x.getDate()+7);dates.push(isoOf(x));}
    let first=null;dates.forEach(dt=>{const id=Math.max(0,...actions.map(a=>a.id))+1;actions.push(Object.assign({id,by:me.id,status:"open"},rec,{date:dt}));if(!first)first=id;});
    prefill=null;toast(dates.length>1?dates.length+" actions publiées":"Action publiée");go("detail",first);});
  on("acc",v=>{if(v.first!==undefined){const f=(v.first||"").trim(),l=(v.last||"").trim();if(!f||!l){toast("Indiquez votre prénom et votre nom");return;}me.first=f;me.last=l;me.name=pubName(f,l);actions.forEach(a=>{if(a.by===me.id)a.name=me.name;});}if(v.phone!==undefined)me.phone=v.phone;me.school=v.school;
    if("n_inscrits" in v||document.querySelector('[name="n_inscrits"]')) me.notif={inscrits:!!v.n_inscrits,changes:!!v.n_changes,rappel:!!v.n_rappel};
    if(view==="pending"&&v.school){const mods=users.filter(u=>u.role==="moderator"&&sectorOf(u.school)===sectorOf(v.school));mods.forEach(m=>sendMail(m,"Nouveau compte à valider : "+me.name,me.name+" ("+me.email+") attend la validation de son compte pour l'établissement "+v.school+".\n"+SITE+"/moderation"));}
    toast("Enregistré");go(view==="welcome"?"list":view);});
  on("msgf",v=>{const a=actions.find(x=>x.id===param);const r=avail.find(x=>x.a===a.id&&x.u===me.id);const c=(v.c||"").trim();
    if(r&&c!==(r.c||"")){r.c=c;const p=userById(a.by);if(p&&p.id!==me.id&&p.notif.inscrits)sendMail(p,"Message de "+me.name+" : "+a.title,me.name+(c?" a modifié son message :\n« "+c+" »":" a retiré son message.")+"\n\n"+resume(a));}
    toast(c?"Message enregistré et transmis au responsable":"Message retiré");render();});
  on("transf",v=>{if(!v.u)return;const a=actions.find(x=>x.id===param);const to=userById(Number(v.u));transfer(a,to);toast("Responsabilité transférée à "+to.name);render();});
  const sx=()=>schoolById(param), today=()=>addDays(0);
  on("devenirf",v=>{const x=sx();if(x.ref){toast("Cet établissement a déjà un référent");render();return;}x.ref=me.id;x.consent=!!v.consent&&!!me.phone;x.upd=today();toast("Vous êtes maintenant référent de "+x.n);render();});
  on("consentf",v=>{const x=sx();x.consent=!!v.consent&&!!me.phone;toast(x.consent?"Votre numéro est affiché sur la fiche":"Votre numéro n'est plus affiché");render();});
  on("fichef",v=>{const x=sx();x.depot=(v.depot||"").trim();x.notes=(v.notes||"").trim();x.upd=today();toast("Fiche enregistrée");render();});
  on("nommerf",v=>{const x=sx(),id=Number(v.u);if(id===x.ref){render();return;}x.ref=id||null;x.consent=false;x.upd=today();
    if(!id){toast("Référent retiré");render();return;}const to=userById(id);
    if(to.id!==me.id){sendMail(to,"Vous êtes référent : "+x.n,"Bonjour "+to.name+",\n\n"+me.name+" vous a nommé(e) référent de "+x.n+" ("+x.s+").\n\nVotre numéro de téléphone n'est pas affiché sur la fiche. Pour le rendre visible des membres validés, ouvrez la fiche et cochez la case prévue :\n"+SITE+"/index.php?p=etablissement&id="+x.id+"\n\nSi vous ne souhaitez pas être référent, vous pouvez vous retirer depuis cette même page.");toast(to.name+" est référent et en est prévenu(e) par e-mail");}
    else toast("Vous êtes maintenant référent de "+x.n);render();});
  on("namef",v=>{siteName=(v.n||"").trim()||"Actions militantes";applyBrand();toast("Nom du site enregistré");render();});
  const lf=document.getElementById("logofile"); if(lf) lf.onchange=()=>{const f=lf.files[0]; if(!f) return;
    if(!["image/png","image/jpeg","image/webp"].includes(f.type)||f.size>2*1024*1024){toast("Choisissez une image PNG, JPEG ou WebP de 2 Mo au plus");return;}
    const r=new FileReader(); r.onload=()=>{siteLogo=r.result;applyBrand();toast("Logo enregistré");render();}; r.readAsDataURL(f);};
  on("secf",v=>{const s=v.s.trim();if(s&&!SECTORS.includes(s)){SECTORS.push(s);invites[s]={token:token(),since:addDays(0),used:0};toast("Secteur ajouté, avec son lien d'invitation");}render();});
  on("schf",v=>{const n=v.n.trim();if(n&&!schools.some(x=>x.n===n)){schools.push({n,s:v.s,id:Math.max(0,...schools.map(x=>x.id))+1,ref:null,consent:false,depot:"",notes:"",upd:""});toast("Établissement ajouté");}render();});
  on("typef",v=>{const t=v.t.trim();if(t&&!TYPES.includes(t)){TYPES.push(t);toast("Type ajouté");}render();});
  const sch=document.getElementById("sel-school"), hint=document.getElementById("sec-hint");
  if(sch&&hint) sch.onchange=()=>{hint.innerHTML=sch.value?"Secteur"+NB+": "+secTag(sectorOf(sch.value)):"Le secteur sera déduit de l'établissement.";};
  document.querySelectorAll('select[data-act="role"]').forEach(s=>s.onchange=()=>{userById(Number(s.dataset.u)).role=s.value;toast("Rôle modifié");});
  document.querySelectorAll("form.namefix").forEach(f=>f.onsubmit=e=>{e.preventDefault();const u=userById(Number(f.dataset.u)),fd=new FormData(f),fi=fd.get("first").trim(),la=fd.get("last").trim();if(!fi||!la)return;
    u.first=fi;u.last=la;u.name=pubName(fi,la);actions.forEach(a=>{if(a.by===u.id)a.name=u.name;});toast("Nom corrigé : "+fi+" "+la+" (affiché « "+u.name+" » aux membres)");render();});
  document.querySelectorAll("form.renf").forEach(f=>f.onsubmit=e=>{e.preventDefault();const x=schoolById(Number(f.dataset.id)),n=new FormData(f).get("n").trim();
    if(!n||n===x.n){render();return;} if(schools.some(y=>y.n===n)){toast("Ce nom existe déjà");return;}
    users.forEach(u=>{if(u.school===x.n)u.school=n;}); x.n=n; toast("Établissement renommé : "+n); render();});
  document.querySelectorAll('select[data-act="usersch"]').forEach(s=>s.onchange=()=>{const u=userById(Number(s.dataset.u));u.school=s.value;toast(u.name+(s.value?" est rattaché(e) à "+s.value+" (secteur "+sectorOf(s.value)+")":" n'est plus rattaché(e) à un établissement"));render();});
  document.querySelectorAll('select[data-act="schsec"]').forEach(s=>s.onchange=()=>{schools.find(x=>x.n===s.dataset.n).s=s.value;toast("Établissement déplacé en "+s.value);render();});
}
const confirmState={};
const confirmClick=(b,key,label)=>{if(confirmState[key]){delete confirmState[key];return true;}confirmState[key]=1;b.textContent=label;setTimeout(()=>{delete confirmState[key];},5000);return false;};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();if(g.dataset.go==="new")prefill=null;go(g.dataset.go,g.dataset.p?Number(g.dataset.p):null);return;}
  const b=e.target.closest("[data-act]"); if(!b||b.tagName==="SELECT") return;
  const act=b.dataset.act, aid=Number(b.dataset.a), a=actions.find(x=>x.id===aid);
  if(act==="invite"){pendingInvite=b.dataset.s;me=null;flash={};go("login");toast("Lien d'invitation du secteur "+b.dataset.s+" ouvert");return;}
  if(act==="as"){me=userById(Number(b.dataset.u));pendingInvite=null;go(me.role==="pending"?"pending":"list");return;}
  if(act==="logout"){me=null;pendingInvite=null;go("login");return;}
  if(act==="resend"){otp.code=String(Math.floor(100000+Math.random()*900000));otp.exp=Date.now()+10*60000;otp.tries=0;flash={};toast("Nouveau code envoyé");render();return;}
  if(act==="toggle"){const i=avail.findIndex(x=>x.a===aid&&x.u===me.id);
    if(i>=0){avail.splice(i,1);toast("Disponibilité retirée");render();return;}
    const dlg=document.getElementById("dispodlg");
    if(typeof dlg.showModal!=="function"){signUp(a,"");render();return;}
    document.getElementById("dispolbl").textContent="Un message pour "+a.name+NB+"?";
    document.getElementById("dispotxt").value="";
    dlg.onclose=()=>{if(dlg.returnValue==="ok"){signUp(a,document.getElementById("dispotxt").value.trim());render();}};
    dlg.returnValue="";dlg.showModal();document.getElementById("dispotxt").focus();return;}
  if(act==="quitref"){if(!confirmClick(b,"quitref","Confirmer : ne plus être référent"))return;const x=schoolById(param);x.ref=null;x.consent=false;x.upd=addDays(0);toast("Vous n'êtes plus référent de "+x.n);render();return;}
  if(act==="copyrecap"){const t=recapText(recSector);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("Message copié"),()=>window.prompt("Copiez le texte :",t));else window.prompt("Copiez le texte :",t);return;}
  if(act==="dellogo"){siteLogo="";applyBrand();toast("Logo retiré");render();return;}
  if(act==="edit"){go("edit",aid);return;}
  if(act==="dup"){prefill=Object.assign({},a,{date:[nextDay(a.date),addDays(1)].sort()[1],id:null});view="new";render();window.scrollTo&&window.scrollTo(0,0);return;}
  if(act==="cancel"){document.getElementById("cancelbox").innerHTML=`<form id="cancelf" class="card" style="margin-top:12px;background:var(--bg)"><label>Message aux inscrits (facultatif)</label><input name="msg" placeholder="Reporté à cause de la pluie…">
      <p class="hint">${count(a)}${NB}personne(s) inscrite(s) recevront un e-mail.</p><div class="row" style="margin-top:10px"><button class="primary" type="submit">Confirmer l'annulation</button></div></form>`;
    document.getElementById("cancelf").onsubmit=ev=>{ev.preventDefault();a.status="cancelled";a.cancelMsg=new FormData(ev.target).get("msg").trim();const n=notifyChange(a,"cancel");toast("Action annulée"+(n?" – "+n+" inscrit(s) prévenu(s)":""));render();};return;}
  if(act==="reopen"){a.status="open";a.cancelMsg="";toast("Action rétablie");render();return;}
  if(act==="ics"){document.getElementById("icsbox").innerHTML=`<p class="democode">Démonstration&nbsp;: sur le site réel, ce bouton télécharge le fichier «${NB}action-${refOf(a)}.ics${NB}», qui s'ouvre dans l'agenda du téléphone ou de l'ordinateur. Contenu&nbsp;:</p><pre class="ics">${esc(icsOf(a))}</pre>`;return;}
  if(act==="copy"){try{navigator.clipboard.writeText(shareText(a)).then(()=>toast("Message copié"),()=>toast("Copie impossible ici"));}catch(err){toast("Copie impossible ici");}return;}
  if(act==="approve"){const u=userById(Number(b.dataset.u));u.role="member";sendMail(u,"Votre compte est validé","Bonjour "+u.name+", votre compte est validé. Vous pouvez voir les actions et vous inscrire :\n"+SITE);toast("Compte validé – "+u.name+" est prévenu(e)");render();return;}
  if(act==="refuse"){users=users.filter(u=>u.id!==Number(b.dataset.u));toast("Compte refusé");render();return;}
  if(act==="block"){if(!confirmClick(b,"block"+b.dataset.u,"Confirmer"))return;userById(Number(b.dataset.u)).role="pending";schools.forEach(x=>{if(x.ref===Number(b.dataset.u)){x.ref=null;x.consent=false;}});toast("Accès retiré : compte remis en attente");render();return;}
  if(act==="csv"){toast("Démonstration : pas de téléchargement ici.");return;}
  if(act==="copyinv"){try{navigator.clipboard.writeText(inviteUrl(b.dataset.s)).then(()=>toast("Lien copié – à partager uniquement dans le groupe WhatsApp du secteur"),()=>toast("Copie impossible ici"));}catch(err){toast("Copie impossible ici");}return;}
  if(act==="resetinv"){if(!confirmClick(b,"reset"+b.dataset.s,"Confirmer : l'ancien lien ne marchera plus"))return;invites[b.dataset.s]={token:token(),since:addDays(0),used:0};toast("Nouveau lien créé pour "+b.dataset.s+" : partagez-le dans le groupe du secteur");render();return;}
  if(act==="delsec"){SECTORS=SECTORS.filter(s=>s!==b.dataset.s);delete invites[b.dataset.s];toast("Secteur supprimé");render();return;}
  if(act==="delsch"){schools=schools.filter(x=>x.n!==b.dataset.n);toast("Établissement supprimé");render();return;}
  if(act==="deltype"){TYPES=TYPES.filter(t=>t!==b.dataset.t);toast("Type retiré (les actions existantes le gardent)");render();return;}
  if(act==="delme"){if(!confirmClick(b,"delme","Confirmer la suppression"))return;
    users=users.filter(u=>u.id!==me.id);avail=avail.filter(x=>x.u!==me.id);actions=actions.filter(x=>x.by!==me.id);me=null;toast("Compte supprimé");go("login");return;}
});
render();
})();
